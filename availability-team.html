<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MKB Team">
<meta name="theme-color" content="#4A1A24">
<meta name="robots" content="noindex, nofollow">
<title>Team Availability | MKBeauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6EEEC; --paper-2:#FBF6F5; --ink:#191714; --stone:#857A76; --hair:#E3D5D2;
    --burgundy:#4A1A24; --pink:#D9AEB5; --blush:#EFD8DC; --sage:#DCE6D4; --sage-ink:#3E5A36; --off:#E6DEDC;
    --serif:'Cormorant Garamond',serif; --sans:'Jost',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;background:var(--paper);}
  body{font-family:var(--sans);font-weight:300;color:var(--ink);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;}
  a{color:inherit;} button{font-family:var(--sans);}
  :focus-visible{outline:2px solid var(--burgundy);outline-offset:3px;}

  .hero{background:var(--burgundy);color:var(--paper);padding:56px 24px 36px;}
  .hero-inner,.wrap{max-width:680px;margin:0 auto;}
  .brand{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--pink);margin-bottom:48px;}
  .hero h1{font-family:var(--serif);font-weight:300;font-size:58px;line-height:0.95;margin:0;}
  .hero h1 span{display:block;font-style:italic;color:var(--pink);}
  .hero p{margin:22px 0 0;padding-top:14px;border-top:1px solid rgba(217,174,181,0.45);font-size:14px;color:rgba(246,238,236,0.85);}

  .wrap{padding:40px 24px 8px;}
  h2{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.05;margin:0 0 6px;}
  .lede{color:var(--stone);margin:0 0 22px;}
  .link{background:none;border:none;padding:0;cursor:pointer;font-size:14px;color:var(--burgundy);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;min-height:32px;white-space:nowrap;}
  .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--burgundy);color:var(--paper);border:none;border-radius:10px;padding:0 20px;min-height:44px;font-size:14px;cursor:pointer;}

  /* Calendar */
  .cal{border:1px solid var(--burgundy);border-radius:14px;overflow:hidden;background:var(--paper-2);}
  .month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--burgundy);color:var(--paper);padding:4px 6px;}
  .month-title{font-family:var(--serif);font-size:24px;}
  .month-nav button{background:none;border:none;font-family:var(--serif);font-size:30px;line-height:1;color:var(--pink);width:44px;height:44px;cursor:pointer;}
  .month-nav button:disabled{color:rgba(217,174,181,0.3);cursor:default;}
  .weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:4px 8px 0;}
  .weekdays div{text-align:center;font-size:12px;color:var(--stone);padding:8px 0 7px;}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:2px 8px 10px;}
  .day{position:relative;aspect-ratio:1/1.1;background:#fff;border:1px solid var(--hair);border-radius:9px;cursor:pointer;user-select:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
  .day .c{font-size:15px;line-height:1;}
  .day.blank{visibility:hidden;}
  .day.past{background:transparent;border-color:#EDE3E1;color:#C9BBB8;}
  .day.selected{box-shadow:0 0 0 2px var(--ink);}
  .counts{display:flex;gap:3px;min-height:15px;}
  .n{font-size:10px;line-height:1;padding:3px 4px;min-width:15px;text-align:center;font-weight:400;border-radius:4px;}
  .n-av{background:var(--sage);color:var(--sage-ink);}
  .n-bk{background:var(--blush);color:var(--burgundy);box-shadow:inset 0 0 0 1px var(--burgundy);}
  .key{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:13px;color:var(--stone);align-items:center;}
  .key span{display:inline-flex;align-items:center;gap:7px;}

  /* Day roster */
  .panel{margin-top:30px;padding-top:22px;border-top:1px solid var(--ink);}
  .panel-date{font-family:var(--serif);font-size:28px;line-height:1.1;}
  .summary{font-size:14px;color:var(--stone);margin:4px 0 6px;}
  .group{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--burgundy);margin:22px 0 4px;}
  .person{display:grid;grid-template-columns:12px 1fr auto;gap:14px;align-items:start;padding:13px 0;border-top:1px solid var(--hair);}
  .person:last-child{border-bottom:1px solid var(--hair);}
  .mark{width:12px;height:12px;margin-top:9px;border-radius:3px;}
  .mark.av{background:var(--sage);} .mark.off{background:var(--off);} .mark.none{box-shadow:inset 0 0 0 1px #C9BBB8;}
  .mark.bk{background:var(--blush);box-shadow:inset 0 0 0 1px var(--burgundy);}
  .p-name{font-family:var(--serif);font-size:22px;line-height:1.2;}
  .p-note{font-size:14px;color:var(--stone);}
  .p-note.bk{color:var(--burgundy);}
  .book-form{grid-column:2/-1;display:flex;gap:10px;align-items:center;margin-top:4px;}
  .book-form input{flex:1;min-width:0;font-family:var(--sans);font-weight:300;font-size:16px;background:transparent;border:none;border-bottom:1px solid #CDBDB9;padding:8px 0;color:var(--ink);}
  .book-form input:focus{outline:none;border-bottom-color:var(--burgundy);}

  /* Artist pages */
  .artists{margin-top:4px;}
  .artist{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--hair);}
  .artist:last-child{border-bottom:1px solid var(--hair);}
  .a-name{font-family:var(--serif);font-size:22px;line-height:1.2;}
  .a-sub{font-size:13px;color:var(--stone);}
  .a-sub .need{color:var(--burgundy);} .a-sub .ok{color:var(--sage-ink);}
  .a-actions{display:flex;gap:18px;}

  .login{max-width:360px;margin:20px auto 0;}
  .login label{display:block;font-size:13px;color:var(--stone);}
  .login input{width:100%;font-family:var(--sans);font-size:16px;background:transparent;border:none;border-bottom:1px solid var(--ink);padding:10px 0;margin:2px 0 16px;}
  .login input:focus{outline:none;border-bottom-color:var(--burgundy);}
  .err{color:var(--burgundy);font-size:14px;min-height:22px;}
  .message{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--stone);padding:40px 0;}
  .foot-actions{display:flex;gap:24px;flex-wrap:wrap;margin:36px 0 10px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:14px;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;}
  .toast.show{opacity:1;}
  .footer{background:var(--ink);color:var(--paper);padding:36px 24px 44px;margin-top:56px;}
  .footer-inner{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .footer .b{font-family:var(--serif);font-style:italic;font-size:21px;}
  .footer .s{font-size:12px;color:rgba(246,238,236,0.5);}
  @media(max-width:480px){.hero h1{font-size:50px;} .a-actions{gap:14px;}}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
  /* Type weights: match the fonts loaded on every MKBeauty page (Cormorant 300/400/500, italic 400/500; Jost 300/400/500) */
  .brand,.hero h1 .last,.hero h1 span,.hero-meta .tier,.footer .b,.group,.month-title,.panel-date,.ev-name,.doc-name,.p-name,.a-name,.row .amt,.booked-note .v,.quiet,.message{font-weight:400;}
</style>
</head>
<body>

<header class="hero"><div class="hero-inner">
  <div class="brand">MKBeauty Artistry</div>
  <h1>Team<span>availability</span></h1>
  <p>Tap a date to see who's free, who's booked, and who hasn't answered yet.</p>
</div></header>

<main class="wrap" id="app"><div class="message">Loading...</div></main>
<div class="toast" id="toast" role="status"></div>

<div class="footer"><div class="footer-inner">
  <div class="b">MKBeauty Artistry</div>
  <div class="s">For Morgan. Not for client distribution.</div>
</div></div>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbxWpmfN1OQy2hr9k31XFQZPLacv0NeL6jUGpTbdcJ-2RkyzSrJ-uiB2g7pIcZWrbzGQKQ/exec"; // same URL as artist.html
const ARTIST_PAGE_URL = "https://mkbeauty-artistry.vercel.app/artist";
const MONTHS_AHEAD = 12;

const DEMO = API_URL.indexOf('PASTE_') === 0;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const KEY_STORE = 'mkb_team_key';

let data = { artists:[], entries:{}, booked:{} };
let teamKey = '';
let viewYear, viewMonth, selected = null, bookingFor = null;
const today = new Date(); today.setHours(0,0,0,0);
const firstMonth = new Date(today.getFullYear(), today.getMonth(), 1);
const lastMonth = new Date(today.getFullYear(), today.getMonth() + MONTHS_AHEAD - 1, 1);

function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromKey(k){ const p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1800); }
function getStored(){ try { return localStorage.getItem(KEY_STORE) || ''; } catch(e){ return ''; } }
function setStored(v){ try { v ? localStorage.setItem(KEY_STORE, v) : localStorage.removeItem(KEY_STORE); } catch(e){} }

/* ---------- Login + load ---------- */
async function start(){
  if (DEMO) { data = demoData(); return begin(); }
  teamKey = getStored();
  if (!teamKey) return showLogin('');
  if (await fetchData()) begin();
}
function showLogin(err){
  document.getElementById('app').innerHTML = `<div class="login">
    <h2>Welcome back</h2><p class="lede">Enter your team password. This device will remember it.</p>
    <label for="pw">Team password</label><input type="password" id="pw" autocomplete="current-password">
    <div class="err">${esc(err)}</div><button class="btn" id="pwBtn">Open team view</button></div>`;
  const go = async ()=>{ teamKey = document.getElementById('pw').value.trim(); if (!teamKey) return; if (await fetchData()) { setStored(teamKey); begin(); } };
  document.getElementById('pwBtn').onclick = go;
  document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}
async function fetchData(){
  try{
    const res = await fetch(API_URL + '?team=' + encodeURIComponent(teamKey));
    const d = await res.json();
    if (d.error) { setStored(''); showLogin(/password/i.test(d.error) ? 'That password didn\'t work. Try again.' : d.error); return false; }
    data = d; return true;
  }catch(e){
    document.getElementById('app').innerHTML = '<div class="message">The team view didn\'t load. Check your connection and refresh.</div>';
    return false;
  }
}
function begin(){
  if (!viewYear) {
    viewYear = firstMonth.getFullYear(); viewMonth = firstMonth.getMonth();
    if (DEMO) { viewMonth += 1; if (viewMonth > 11) { viewMonth = 0; viewYear++; } }
  }
  renderShell(); renderMonth(); renderLinks();
}

function statusOf(code, k){
  const bk = (data.booked[code] || {})[k];
  if (bk) return { kind:'bk', label: bk.label, source: bk.source };
  const en = (data.entries[code] || {})[k] || {};
  if (en.status === 'Available') return { kind:'av', note: en.note };
  if (en.status === 'Unavailable') return { kind:'off', note: en.note };
  return { kind:'none', note: en.note };
}

/* ---------- Render ---------- */
function renderShell(){
  document.getElementById('app').innerHTML = `
    <div class="cal">
      <div class="month-nav">
        <button id="prevBtn" aria-label="Previous month">&lsaquo;</button>
        <div class="month-title" id="monthTitle"></div>
        <button id="nextBtn" aria-label="Next month">&rsaquo;</button>
      </div>
      <div class="weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="key"><span><span class="n n-av">3</span>artists available</span><span><span class="n n-bk">2</span>booked with MKB</span></div>
    <div id="panel"></div>

    <section style="margin-top:56px;">
      <h2>Artist pages</h2>
      <p class="lede">Each artist's private link. Open it to see what she sees, or copy it to text her.</p>
      <div class="artists" id="links"></div>
    </section>
    <div class="foot-actions"><button class="link" id="refreshBtn">Refresh</button>
      ${DEMO ? '' : '<button class="link" id="logoutBtn">Forget password on this device</button>'}</div>`;
  document.getElementById('prevBtn').onclick = ()=> shiftMonth(-1);
  document.getElementById('nextBtn').onclick = ()=> shiftMonth(1);
  document.getElementById('refreshBtn').onclick = async ()=> { if (DEMO || await fetchData()) { renderMonth(); renderLinks(); toast('Up to date'); } };
  const lo = document.getElementById('logoutBtn');
  if (lo) lo.onclick = ()=> { setStored(''); location.reload(); };
}
function shiftMonth(n){
  const d = new Date(viewYear, viewMonth + n, 1);
  if (d < firstMonth || d > lastMonth) return;
  viewYear = d.getFullYear(); viewMonth = d.getMonth(); selected = null; bookingFor = null;
  renderMonth();
}
function renderMonth(){
  document.getElementById('monthTitle').textContent = MONTHS[viewMonth] + ' ' + viewYear;
  const cur = new Date(viewYear, viewMonth, 1);
  document.getElementById('prevBtn').disabled = cur <= firstMonth;
  document.getElementById('nextBtn').disabled = cur >= lastMonth;
  const days = new Date(viewYear, viewMonth + 1, 0).getDate();
  let html = '';
  for (let i = 0; i < cur.getDay(); i++) html += '<div class="day blank"></div>';
  for (let d = 1; d <= days; d++){
    const date = new Date(viewYear, viewMonth, d), k = keyOf(date);
    let av = 0, bk = 0;
    data.artists.forEach(a => { const s = statusOf(a.code, k).kind; if (s === 'av') av++; if (s === 'bk') bk++; });
    const cls = 'day' + (date < today ? ' past' : '') + (k === selected ? ' selected' : '');
    html += `<div class="${cls}" data-k="${k}" role="button" tabindex="0" aria-label="${esc(MONTHS[viewMonth]+' '+d+', '+av+' available, '+bk+' booked')}"><span class="c">${d}</span>
      <span class="counts">${av ? `<span class="n n-av">${av}</span>` : ''}${bk ? `<span class="n n-bk">${bk}</span>` : ''}</span></div>`;
  }
  for (let i = cur.getDay() + days; i % 7 !== 0; i++) html += '<div class="day blank"></div>';
  const grid = document.getElementById('grid');
  grid.innerHTML = html;
  grid.querySelectorAll('.day[data-k]').forEach(el => {
    const pick = ()=> { const k = el.getAttribute('data-k'); selected = selected === k ? null : k; bookingFor = null; renderMonth();
      if (selected) setTimeout(()=> document.getElementById('panel').scrollIntoView({behavior:'smooth', block:'start'}), 30); };
    el.onclick = pick;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
  });
  renderPanel();
}
function renderPanel(){
  const panel = document.getElementById('panel');
  if (!selected) { panel.innerHTML = ''; return; }
  const d = fromKey(selected);
  const groups = { av:[], bk:[], off:[], none:[] };
  data.artists.forEach(a => groups[statusOf(a.code, selected).kind].push(a));
  const section = (key, name) => groups[key].length ? `<div class="group">${name}</div>` + groups[key].map(a => personHtml(a, key)).join('') : '';
  const parts = [groups.av.length + ' available', groups.bk.length + ' booked', groups.off.length + ' unavailable', groups.none.length + ' not marked'];
  panel.innerHTML = `<div class="panel">
    <div class="panel-date">${esc(DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate())}</div>
    <div class="summary">${esc(parts.join(', '))}</div>
    ${section('av','Available')}${section('bk','Booked with MKB')}${section('off','Unavailable')}${section('none','Not marked yet')}</div>`;
  panel.querySelectorAll('[data-act]').forEach(b => b.onclick = ()=> handleAct(b.getAttribute('data-act'), b.getAttribute('data-code')));
  const input = document.getElementById('bookLabel');
  if (input) { input.focus(); input.addEventListener('keydown', e => { if (e.key === 'Enter') handleAct('confirm', bookingFor); }); }
}
function personHtml(a, kind){
  const s = statusOf(a.code, selected);
  let note = s.note ? `<div class="p-note">${esc(s.note)}</div>` : '', action = '';
  if (kind === 'bk') {
    note = `<div class="p-note bk">${esc(s.label)}${s.source === 'pipeline' ? ', from Bookings Pipeline' : ''}</div>`;
    if (s.source !== 'pipeline') action = `<button class="link" data-act="unbook" data-code="${esc(a.code)}">Remove</button>`;
  } else {
    action = `<button class="link" data-act="book" data-code="${esc(a.code)}">${bookingFor === a.code ? 'Cancel' : 'Book'}</button>`;
  }
  const form = (bookingFor === a.code) ? `<div class="book-form"><input id="bookLabel" placeholder="Bride's name">
    <button class="btn" data-act="confirm" data-code="${esc(a.code)}">Save</button></div>` : '';
  return `<div class="person"><span class="mark ${kind}"></span><div><div class="p-name">${esc(a.name)}</div>${note}</div><div>${action}</div>${form}</div>`;
}
async function handleAct(act, code){
  if (act === 'book') { bookingFor = bookingFor === code ? null : code; renderPanel(); return; }
  if (act === 'confirm') { const label = (document.getElementById('bookLabel').value || '').trim() || 'Booked'; await saveBooking(code, true, label); }
  if (act === 'unbook') await saveBooking(code, false, '');
}
async function saveBooking(code, booked, label){
  const k = selected;
  try{
    if (!DEMO) {
      const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'teamSetBooked', team: teamKey, code, date: k, booked, label }) });
      const d = await res.json();
      if (d.error) throw new Error(d.error);
    }
    data.booked[code] = data.booked[code] || {}; data.entries[code] = data.entries[code] || {};
    if (booked) { data.booked[code][k] = { label, source:'manual' }; delete data.entries[code][k]; }
    else delete data.booked[code][k];
    bookingFor = null;
    renderMonth();
    toast(booked ? 'Booked' : 'Booking removed');
  }catch(e){ toast('Not saved. Try again.'); }
}

/* ---------- Artist pages ---------- */
function renderLinks(){
  const wrap = document.getElementById('links');
  if (!data.artists.length) { wrap.innerHTML = '<div class="message">No artists yet. Add them on the Artist Roster tab, then run setupArtistHub.</div>'; return; }
  wrap.innerHTML = data.artists.map(a => { const url = ARTIST_PAGE_URL + '?a=' + encodeURIComponent(a.code); return `<div class="artist">
    <div><div class="a-name">${esc(a.name)}</div>
    <div class="a-sub">${a.tier ? esc(a.tier) + ', ' : ''}<span class="${a.w9 ? 'ok' : 'need'}">W-9 ${a.w9 ? 'received' : 'needed'}</span></div></div>
    <div class="a-actions"><a class="link" href="${esc(url)}" target="_blank" rel="noopener">Open</a><button class="link" data-link="${esc(url)}">Copy link</button></div></div>`; }).join('');
  wrap.querySelectorAll('[data-link]').forEach(b => b.onclick = async ()=> {
    const url = b.getAttribute('data-link');
    try { await navigator.clipboard.writeText(url); toast('Link copied'); }
    catch(e) { window.prompt('Copy this link:', url); }
  });
}

/* ---------- Preview data (only used in preview mode) ---------- */
function demoData(){
  const m = new Date(today.getFullYear(), today.getMonth() + 1, 1);
  const k = d => keyOf(new Date(m.getFullYear(), m.getMonth(), d));
  const tiers = ['Soie','Soie','Chiffon','Chiffon','Soie','Cachemire','Chiffon','Soie'];
  const artists = ['Jenifer','Heather','Mari','Patty','Emily','Justine','Anastasia','Maria'].map((n,i)=>({ code:'demo'+i, name:n, tier:tiers[i], w9: i % 3 !== 0 }));
  const entries = {}, booked = {};
  artists.forEach(a => { entries[a.code] = {}; booked[a.code] = {}; });
  [[0,7,'av',''],[1,7,'av','Can do hair only'],[2,7,'off','Out of town'],[4,7,'av',''],[5,7,'off',''],
   [0,14,'av',''],[1,14,'av',''],[3,14,'av','Free after 11am'],[6,14,'off',''],
   [2,21,'av',''],[4,21,'off',''],[1,28,'av',''],[5,28,'av','']].forEach(([i,d,s,n]) => {
    entries[artists[i].code][k(d)] = { status: s === 'av' ? 'Available' : 'Unavailable', note: n };
  });
  booked[artists[3].code][k(7)] = { label:'Brielle Whitney', source:'pipeline' };
  booked[artists[6].code][k(7)] = { label:'Brielle Whitney', source:'pipeline' };
  booked[artists[0].code][k(21)] = { label:'Claire Alcock', source:'manual' };
  return { artists, entries, booked };
}

start();
</script>
</body>
</html>
