<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MKB Team">
<meta name="robots" content="noindex, nofollow">
<title>Team Availability | MKBeauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* Brand palette, matched to mkbeauty-artistry.vercel.app (Option A: Cream) */
  :root{
    --cream:#E8E4DF; --parchment:#DDD9D4; --warm-white:#EDEBE8; --ink:#1A1714; --text-2:#4A4541;
    --border:#CCC8C3; --tan:#B09A88; --tan-dark:#6B5446; --burgundy:#6B2737; --pink:#D9AEB5;
    --sage:#DCE3D3; --sage-line:#B7C4AB;
    --cal-head:var(--burgundy);
    --serif:'Cormorant Garamond',serif; --sans:'Jost',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;background:var(--cream);}
  body{font-family:var(--sans);font-weight:300;color:var(--ink);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
  a{color:inherit;} button{font-family:var(--sans);} em{font-style:italic;}
  :focus-visible{outline:2px solid var(--tan-dark);outline-offset:3px;}

  .eyebrow{font-size:11.5px;letter-spacing:0.24em;text-transform:uppercase;color:var(--burgundy);margin:0 0 12px;font-weight:400;}
  .divider{width:48px;height:1px;background:var(--tan);margin:18px 0 20px;}
  h1,h2{font-family:var(--serif);font-weight:400;line-height:1.15;margin:0;}
  h1 em,h2 em{color:var(--burgundy);}

  .hero{background:var(--parchment);padding:52px 24px 36px;}
  .inner,.wrap{max-width:680px;margin:0 auto;}
  .hero h1{font-size:46px;}
  .hero p{margin:0;color:var(--text-2);}
  .wrap{padding:40px 24px 8px;}
  h2{font-size:32px;}
  .lede{color:var(--text-2);margin:0 0 20px;}

  .pill{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 20px;border-radius:999px;cursor:pointer;white-space:nowrap;
    font-family:var(--sans);font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;font-weight:500;text-decoration:none;
    background:transparent;border:1px solid var(--ink);color:var(--ink);transition:background .2s,color .2s;}
  .pill:hover{background:var(--ink);color:var(--cream);}
  .pill.solid{background:var(--ink);color:var(--cream);}
  .pill.small{min-height:34px;padding:0 14px;font-size:10.5px;}
  .pill-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}

  /* Calendar */
  .frame{position:relative;background:var(--warm-white);border:1px solid var(--border);padding:16px 12px 14px;}
  .frame::after{content:"";position:absolute;width:18px;height:18px;border:1px solid var(--tan);bottom:-1px;right:-1px;border-left:none;border-top:none;}
  .month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--cal-head);color:var(--cream);margin:-16px -12px 10px;padding:8px 10px;}
  .month-title{font-family:var(--serif);font-size:24px;}
  .arrow{width:38px;height:38px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;opacity:0.85;}
  .arrow:disabled{opacity:0.25;cursor:default;}
  .weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
  .weekdays div{text-align:center;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-2);padding:2px 0 6px;font-weight:400;}
  .day{position:relative;aspect-ratio:1/1.1;border-radius:10px;border:1px solid var(--border);background:#F6F4F1;cursor:pointer;user-select:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink);}
  .day .c{font-size:15px;line-height:1;}
  .day.blank{visibility:hidden;}
  .day.past{background:transparent;border-color:transparent;color:var(--text-2);opacity:0.55;}
  .day.selected{box-shadow:0 0 0 2px var(--warm-white),0 0 0 3px var(--ink);}
  .counts{display:flex;gap:3px;min-height:16px;}
  .n{font-size:10px;line-height:1;padding:3px 5px;min-width:16px;text-align:center;font-weight:500;border-radius:999px;}
  .n-av{background:var(--sage);color:var(--ink);border:1px solid var(--sage-line);}
  .n-bk{background:var(--burgundy);color:var(--cream);border:1px solid var(--burgundy);}
  .key{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:12.5px;color:var(--text-2);align-items:center;}
  .key span{display:inline-flex;align-items:center;gap:7px;}

  /* Day roster */
  .card{background:var(--warm-white);border:1px solid var(--border);padding:22px 20px;margin-top:18px;}
  .panel-date{font-family:var(--serif);font-size:26px;line-height:1.15;}
  .summary{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
  .summary span{font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid var(--border);font-weight:400;}
  .group{margin:22px 0 2px;}
  .person{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
  .person:last-child{border-bottom:none;}
  .mark{width:12px;height:12px;border-radius:4px;border:1px solid transparent;}
  .mark.av{background:var(--sage);border-color:var(--sage-line);} .mark.off{background:var(--parchment);border-color:var(--border);}
  .mark.none{border-color:var(--text-2);} .mark.bk{background:var(--burgundy);}
  .p-name{font-family:var(--serif);font-size:21px;line-height:1.2;}
  .p-note{font-size:13.5px;color:var(--text-2);}
  .p-note.bk{color:var(--burgundy);}
  .book-form{grid-column:2/-1;display:flex;gap:8px;align-items:center;margin-top:2px;}
  .book-form input{flex:1;min-width:0;font-family:var(--sans);font-weight:300;font-size:16px;background:#F6F4F1;border:1px solid var(--border);padding:9px 12px;color:var(--ink);}
  .book-form input:focus{outline:none;border-color:var(--tan-dark);background:#fff;}

  /* Artist pages */
  .artist{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);}
  .artist:last-child{border-bottom:none;}
  .a-name{font-family:var(--serif);font-size:21px;line-height:1.2;}
  .a-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .chip{white-space:nowrap;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--border);font-weight:400;color:var(--ink);}
  .chip.tier{font-family:var(--serif);font-style:italic;font-size:13px;letter-spacing:0;text-transform:none;padding:1px 10px;}
  .chip.ok{background:var(--sage);border-color:var(--sage-line);}
  .chip.need{background:#F0DEDF;border-color:var(--burgundy);color:var(--burgundy);}
  .a-actions{display:flex;gap:6px;flex-shrink:0;}

  .login{max-width:380px;margin:0 auto;}
  label.field{display:block;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-2);margin-bottom:4px;font-weight:400;}
  .login input{width:100%;font-family:var(--sans);font-size:16px;background:#F6F4F1;border:1px solid var(--border);padding:11px 12px;margin-bottom:6px;}
  .login input:focus{outline:none;border-color:var(--tan-dark);background:#fff;}
  .err{color:var(--burgundy);font-size:14px;min-height:24px;}
  .message{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--text-2);padding:30px 0;text-align:center;}
  .foot-actions{margin:30px 0 0;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--cream);font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;
    padding:11px 20px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;}
  .toast.show{opacity:1;}
  footer{background:var(--ink);color:var(--cream);padding:48px 24px 40px;text-align:center;margin-top:56px;}
  .footer-brand{font-family:var(--serif);font-size:24px;}
  .footer-tagline{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--tan);margin:2px 0 14px;}
  .footer-name{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(232,228,223,.8);}
  @media(max-width:480px){.hero h1{font-size:40px;} .a-actions .pill{padding:0 11px;}}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
</style>
</head>
<body>

<header class="hero"><div class="inner">
  <p class="eyebrow">MKBeauty Artistry</p>
  <h1>Team <em>availability</em></h1>
  <div class="divider"></div>
  <p>Tap a date to see who's free, who's booked, and who hasn't answered yet.</p>
</div></header>

<main class="wrap" id="app"><div class="message">Loading...</div></main>
<div class="toast" id="toast" role="status"></div>

<footer>
  <div class="footer-brand">MKBeauty Artistry</div>
  <div class="footer-tagline">Team availability</div>
  <div class="footer-name">For Morgan. Not for client distribution.</div>
</footer>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbxWpmfN1OQy2hr9k31XFQZPLacv0NeL6jUGpTbdcJ-2RkyzSrJ-uiB2g7pIcZWrbzGQKQ/exec"; // same URL as artist.html
const ARTIST_PAGE_URL = "https://mkbeauty-artistry.vercel.app/artist";
const MONTHS_AHEAD = 12;

const DEMO = API_URL.indexOf('PASTE_') === 0;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const KEY_STORE = 'mkb_team_key';

let data = { artists:[], entries:{}, booked:{} };
let teamKey = '';
let viewYear, viewMonth, selected = null, bookingFor = null;
const today = new Date(); today.setHours(0,0,0,0);
const firstMonth = new Date(today.getFullYear(), today.getMonth(), 1);
const lastMonth = new Date(today.getFullYear(), today.getMonth() + MONTHS_AHEAD - 1, 1);

function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromKey(k){ const p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1800); }
function getStored(){ try { return localStorage.getItem(KEY_STORE) || ''; } catch(e){ return ''; } }
function setStored(v){ try { v ? localStorage.setItem(KEY_STORE, v) : localStorage.removeItem(KEY_STORE); } catch(e){} }

/* ---------- Login + load ---------- */
async function start(){
  if (DEMO) { data = demoData(); return begin(); }
  teamKey = getStored();
  if (!teamKey) return showLogin('');
  if (await fetchData()) begin();
}
function showLogin(err){
  document.getElementById('app').innerHTML = `<div class="login card">
    <p class="eyebrow">Welcome back</p><h2>Team <em>password</em></h2><div class="divider"></div>
    <p class="lede">This device will remember it after the first time.</p>
    <label class="field" for="pw">Password</label><input type="password" id="pw" autocomplete="current-password">
    <div class="err">${esc(err)}</div><button class="pill solid" id="pwBtn">Open team view</button></div>`;
  const go = async ()=>{ teamKey = document.getElementById('pw').value.trim(); if (!teamKey) return; if (await fetchData()) { setStored(teamKey); begin(); } };
  document.getElementById('pwBtn').onclick = go;
  document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}
async function fetchData(){
  try{
    const res = await fetch(API_URL + '?team=' + encodeURIComponent(teamKey));
    const d = await res.json();
    if (d.error) { setStored(''); showLogin(/password/i.test(d.error) ? 'That password didn\'t work. Try again.' : d.error); return false; }
    data = d; return true;
  }catch(e){
    document.getElementById('app').innerHTML = '<div class="message">The team view didn\'t load. Check your connection and refresh.</div>';
    return false;
  }
}
function begin(){
  if (!viewYear) {
    viewYear = firstMonth.getFullYear(); viewMonth = firstMonth.getMonth();
    if (DEMO) { viewMonth += 1; if (viewMonth > 11) { viewMonth = 0; viewYear++; } }
  }
  renderShell(); renderMonth(); renderLinks();
}

function statusOf(code, k){
  const bk = (data.booked[code] || {})[k];
  if (bk) return { kind:'bk', label: bk.label, source: bk.source };
  const en = (data.entries[code] || {})[k] || {};
  if (en.status === 'Available') return { kind:'av', note: en.note };
  if (en.status === 'Unavailable') return { kind:'off', note: en.note };
  return { kind:'none', note: en.note };
}

/* ---------- Render ---------- */
function renderShell(){
  document.getElementById('app').innerHTML = `
    <div class="frame">
      <div class="month-nav">
        <button class="arrow" id="prevBtn" aria-label="Previous month">&#8249;</button>
        <div class="month-title" id="monthTitle"></div>
        <button class="arrow" id="nextBtn" aria-label="Next month">&#8250;</button>
      </div>
      <div class="weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="key"><span><span class="n n-av">3</span>Artists available</span><span><span class="n n-bk">2</span>Booked with MKB</span></div>
    <div id="panel"></div>

    <section style="margin-top:56px;">
      <p class="eyebrow">Private links</p>
      <h2>Artist <em>pages</em></h2>
      <div class="divider"></div>
      <p class="lede">Open a page to see what she sees, or copy the link to text her.</p>
      <div class="card" id="links" style="padding:4px 20px;margin-top:0;"></div>
    </section>
    <div class="foot-actions pill-row"><button class="pill small" id="refreshBtn">Refresh</button>
      ${DEMO ? '' : '<button class="pill small" id="logoutBtn">Forget password on this device</button>'}</div>`;
  document.getElementById('prevBtn').onclick = ()=> shiftMonth(-1);
  document.getElementById('nextBtn').onclick = ()=> shiftMonth(1);
  document.getElementById('refreshBtn').onclick = async ()=> { if (DEMO || await fetchData()) { renderMonth(); renderLinks(); toast('Up to date'); } };
  const lo = document.getElementById('logoutBtn');
  if (lo) lo.onclick = ()=> { setStored(''); location.reload(); };
}
function shiftMonth(n){
  const d = new Date(viewYear, viewMonth + n, 1);
  if (d < firstMonth || d > lastMonth) return;
  viewYear = d.getFullYear(); viewMonth = d.getMonth(); selected = null; bookingFor = null;
  renderMonth();
}
function renderMonth(){
  document.getElementById('monthTitle').textContent = MONTHS[viewMonth] + ' ' + viewYear;
  const cur = new Date(viewYear, viewMonth, 1);
  document.getElementById('prevBtn').disabled = cur <= firstMonth;
  document.getElementById('nextBtn').disabled = cur >= lastMonth;
  const days = new Date(viewYear, viewMonth + 1, 0).getDate();
  let html = '';
  for (let i = 0; i < cur.getDay(); i++) html += '<div class="day blank"></div>';
  for (let d = 1; d <= days; d++){
    const date = new Date(viewYear, viewMonth, d), k = keyOf(date);
    let av = 0, bk = 0;
    data.artists.forEach(a => { const s = statusOf(a.code, k).kind; if (s === 'av') av++; if (s === 'bk') bk++; });
    const cls = 'day' + (date < today ? ' past' : '') + (k === selected ? ' selected' : '');
    html += `<div class="${cls}" data-k="${k}" role="button" tabindex="0" aria-label="${esc(MONTHS[viewMonth]+' '+d+', '+av+' available, '+bk+' booked')}"><span class="c">${d}</span>
      <span class="counts">${av ? `<span class="n n-av">${av}</span>` : ''}${bk ? `<span class="n n-bk">${bk}</span>` : ''}</span></div>`;
  }
  const grid = document.getElementById('grid');
  grid.innerHTML = html;
  grid.querySelectorAll('.day[data-k]').forEach(el => {
    const pick = ()=> { const k = el.getAttribute('data-k'); selected = selected === k ? null : k; bookingFor = null; renderMonth(); };
    el.onclick = pick;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
  });
  renderPanel();
}
function renderPanel(){
  const panel = document.getElementById('panel');
  if (!selected) { panel.innerHTML = ''; return; }
  const d = fromKey(selected);
  const groups = { av:[], bk:[], off:[], none:[] };
  data.artists.forEach(a => groups[statusOf(a.code, selected).kind].push(a));
  const section = (key, name) => groups[key].length ? `<p class="eyebrow group">${name}</p>` + groups[key].map(a => personHtml(a, key)).join('') : '';
  panel.innerHTML = `<div class="card">
    <div class="panel-date">${esc(DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate())}</div>
    <div class="summary"><span>${groups.av.length} available</span><span>${groups.bk.length} booked</span><span>${groups.off.length} unavailable</span><span>${groups.none.length} not marked</span></div>
    ${section('av','Available')}${section('bk','Booked with MKB')}${section('off','Unavailable')}${section('none','Not marked yet')}</div>`;
  panel.querySelectorAll('[data-act]').forEach(b => b.onclick = ()=> handleAct(b.getAttribute('data-act'), b.getAttribute('data-code')));
  const input = document.getElementById('bookLabel');
  if (input) { input.focus({ preventScroll:true }); input.addEventListener('keydown', e => { if (e.key === 'Enter') handleAct('confirm', bookingFor); }); }
}
function personHtml(a, kind){
  const s = statusOf(a.code, selected);
  let note = s.note ? `<div class="p-note">${esc(s.note)}</div>` : '', action = '';
  if (kind === 'bk') {
    note = `<div class="p-note bk">${esc(s.label)}${s.source === 'pipeline' ? ', from Bookings Pipeline' : ''}</div>`;
    if (s.source !== 'pipeline') action = `<button class="pill small" data-act="unbook" data-code="${esc(a.code)}">Remove</button>`;
  } else {
    action = `<button class="pill small" data-act="book" data-code="${esc(a.code)}">${bookingFor === a.code ? 'Cancel' : 'Book'}</button>`;
  }
  const form = (bookingFor === a.code) ? `<div class="book-form"><input id="bookLabel" placeholder="Bride's name">
    <button class="pill small solid" data-act="confirm" data-code="${esc(a.code)}">Save</button></div>` : '';
  return `<div class="person"><span class="mark ${kind}"></span><div><div class="p-name">${esc(a.name)}</div>${note}</div><div>${action}</div>${form}</div>`;
}
async function handleAct(act, code){
  if (act === 'book') { bookingFor = bookingFor === code ? null : code; renderPanel(); return; }
  if (act === 'confirm') { const label = (document.getElementById('bookLabel').value || '').trim() || 'Booked'; await saveBooking(code, true, label); }
  if (act === 'unbook') await saveBooking(code, false, '');
}
async function saveBooking(code, booked, label){
  const k = selected;
  try{
    if (!DEMO) {
      const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'teamSetBooked', team: teamKey, code, date: k, booked, label }) });
      const d = await res.json();
      if (d.error) throw new Error(d.error);
    }
    data.booked[code] = data.booked[code] || {}; data.entries[code] = data.entries[code] || {};
    if (booked) { data.booked[code][k] = { label, source:'manual' }; delete data.entries[code][k]; }
    else delete data.booked[code][k];
    bookingFor = null;
    renderMonth();
    toast(booked ? 'Booked' : 'Booking removed');
  }catch(e){ toast('Not saved. Try again.'); }
}

/* ---------- Artist pages ---------- */
function renderLinks(){
  const wrap = document.getElementById('links');
  if (!data.artists.length) { wrap.innerHTML = '<div class="message">No artists yet. Add them on the Artist Roster tab, then run setupArtistHub.</div>'; return; }
  wrap.innerHTML = data.artists.map(a => { const url = ARTIST_PAGE_URL + '?a=' + encodeURIComponent(a.code); return `<div class="artist">
    <div><div class="a-name">${esc(a.name)}</div>
    <div class="a-sub">${a.tier ? `<span class="chip tier">${esc(a.tier)}</span>` : ''}<span class="chip ${a.w9 ? 'ok' : 'need'}">W-9 ${a.w9 ? 'received' : 'needed'}</span><span class="chip ${a.contract ? 'ok' : 'need'}">Agreement ${a.contract ? 'on file' : 'pending'}</span></div></div>
    <div class="a-actions"><a class="pill small" href="${esc(url)}" target="_blank" rel="noopener">Open</a><button class="pill small" data-link="${esc(url)}">Copy</button></div></div>`; }).join('');
  wrap.querySelectorAll('[data-link]').forEach(b => b.onclick = async ()=> {
    const url = b.getAttribute('data-link');
    try { await navigator.clipboard.writeText(url); toast('Link copied'); }
    catch(e) { window.prompt('Copy this link:', url); }
  });
}

/* ---------- Preview data (only used in preview mode) ---------- */
function demoData(){
  const m = new Date(today.getFullYear(), today.getMonth() + 1, 1);
  const k = d => keyOf(new Date(m.getFullYear(), m.getMonth(), d));
  const tiers = ['Soie','Soie','Chiffon','Chiffon','Soie','Cachemire','Chiffon','Soie'];
  const artists = ['Jenifer','Heather','Mari','Patty','Emily','Justine','Anastasia','Maria'].map((n,i)=>({ code:'demo'+i, name:n, tier:tiers[i], w9: i % 3 !== 0, contract: i !== 4 }));
  const entries = {}, booked = {};
  artists.forEach(a => { entries[a.code] = {}; booked[a.code] = {}; });
  [[0,7,'av',''],[1,7,'av','Can do hair only'],[2,7,'off','Out of town'],[4,7,'av',''],[5,7,'off',''],
   [0,14,'av',''],[1,14,'av',''],[3,14,'av','Free after 11am'],[6,14,'off',''],
