<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MKB Artist">
<meta name="theme-color" content="#4A1A24">
<meta name="robots" content="noindex, nofollow">
<title>Artist Page | MKBeauty</title>
<meta property="og:title" content="Your Artist Page | MKBeauty">
<meta property="og:description" content="Your bookings, availability, pay, and documents in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6EEEC; --paper-2:#FBF6F5; --ink:#191714; --stone:#857A76; --hair:#E3D5D2;
    --burgundy:#4A1A24; --wine:#4E2029; --pink:#D9AEB5; --blush:#EFD8DC;
    --sage:#DCE6D4; --sage-ink:#3E5A36;
    --serif:'Cormorant Garamond',serif; --sans:'Jost',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;background:var(--paper);}
  body{font-family:var(--sans);font-weight:300;color:var(--ink);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;}
  a{color:inherit;}
  button{font-family:var(--sans);}
  :focus-visible{outline:2px solid var(--burgundy);outline-offset:3px;}

  /* Hero: the one bold moment */
  .hero{background:var(--burgundy);color:var(--paper);padding:56px 24px 40px;}
  .hero-inner{max-width:560px;margin:0 auto;}
  .brand{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--pink);margin-bottom:56px;}
  .hero h1{font-family:var(--serif);font-weight:300;font-size:64px;line-height:0.95;margin:0;letter-spacing:-0.01em;}
  .hero h1 .last{display:block;font-style:italic;color:var(--pink);}
  .hero-meta{margin-top:28px;padding-top:16px;border-top:1px solid rgba(217,174,181,0.45);display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px;color:rgba(246,238,236,0.85);}
  .hero-meta .tier{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--paper);line-height:1.2;}

  .nav{position:sticky;top:0;z-index:50;background:rgba(246,238,236,0.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--hair);}
  .nav-inner{max-width:560px;margin:0 auto;display:flex;gap:22px;overflow-x:auto;padding:0 24px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .nav-inner::-webkit-scrollbar{display:none;}
  .nav a{flex:0 0 auto;text-decoration:none;font-size:14px;color:var(--stone);padding:15px 0 13px;border-bottom:2px solid transparent;}
  .nav a.on{color:var(--ink);border-bottom-color:var(--burgundy);}

  .section{max-width:560px;margin:0 auto;padding:52px 24px 8px;scroll-margin-top:52px;}
  .section h2{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.05;margin:0 0 6px;}
  .lede{color:var(--stone);margin:0 0 26px;max-width:42ch;}
  .quiet{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--stone);padding:6px 0 10px;}

  .link{background:none;border:none;padding:0;cursor:pointer;font-size:14px;color:var(--burgundy);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;min-height:32px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--burgundy);color:var(--paper);border:none;border-radius:10px;
    padding:0 22px;min-height:46px;font-size:14px;letter-spacing:0.02em;text-decoration:none;cursor:pointer;}
  .btn:disabled{opacity:0.55;cursor:default;}
  .actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin-top:16px;}

  /* Upcoming: appointment-book rows */
  .ev{display:grid;grid-template-columns:64px 1fr;gap:18px;padding:22px 0;border-top:1px solid var(--hair);}
  .ev:last-child{border-bottom:1px solid var(--hair);}
  .ev-day{font-family:var(--serif);font-weight:300;font-size:46px;line-height:0.9;color:var(--burgundy);}
  .ev-mon{font-size:13px;color:var(--stone);margin-top:6px;}
  .ev-name{font-family:var(--serif);font-size:25px;line-height:1.15;}
  .ev-line{color:var(--stone);font-size:14px;}
  .ev-line b{font-weight:400;color:var(--ink);}
  .ev-svc{font-size:14px;margin-top:6px;}

  /* Calendar: a bordered wall-calendar grid with filled squares */
  .cal{border:1px solid var(--burgundy);border-radius:14px;overflow:hidden;background:var(--paper-2);}
  .month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--burgundy);color:var(--paper);padding:4px 6px;}
  .month-title{font-family:var(--serif);font-size:24px;}
  .month-nav button{background:none;border:none;font-family:var(--serif);font-size:30px;line-height:1;color:var(--pink);width:44px;height:44px;cursor:pointer;}
  .month-nav button:disabled{color:rgba(217,174,181,0.3);cursor:default;}
  .weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:4px 8px 0;}
  .weekdays div{text-align:center;font-size:12px;color:var(--stone);padding:8px 0 7px;}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:2px 8px 10px;}
  .day{position:relative;aspect-ratio:1/1.05;background:#fff;border:1px solid var(--hair);border-radius:9px;cursor:pointer;user-select:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .15s;}
  .day .c{font-size:15px;line-height:1;}
  .day .t{font-size:9px;line-height:1;margin-top:4px;letter-spacing:0.02em;}
  .day.blank{visibility:hidden;}
  .day.past{cursor:default;color:#C9BBB8;background:transparent;border-color:#EDE3E1;}
  .day.av{background:var(--sage);border-color:#B9CCAE;color:var(--sage-ink);}
  .day.off{background:#E6DEDC;border-color:#E6DEDC;color:#9C8F8C;}
  .day.off .c{text-decoration:line-through;}
  .day.bk{background:var(--blush);border:1.5px solid var(--burgundy);color:var(--burgundy);}
  .day.bk .c{font-weight:500;}
  .day.today .c{font-weight:500;border-bottom:1.5px solid currentColor;padding-bottom:1px;}
  .day.selected{box-shadow:0 0 0 2px var(--ink);}
  .day .dot{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--burgundy);}
  .legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:13px;color:var(--stone);}
  .legend span{display:inline-flex;align-items:center;gap:7px;}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:4px;}
  .lg-av{background:var(--sage);box-shadow:inset 0 0 0 1px #B9CCAE;} .lg-off{background:#E6DEDC;}
  .lg-bk{background:var(--blush);box-shadow:inset 0 0 0 1px var(--burgundy);}
  .lg-note{width:5px!important;height:5px!important;border-radius:50%;background:var(--burgundy);}

  .panel{margin-top:22px;padding:22px 0 4px;border-top:1px solid var(--ink);}
  .panel-date{font-family:var(--serif);font-size:26px;margin-bottom:16px;}
  .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:18px;}
  .seg button{min-height:48px;border:none;background:transparent;font-size:14px;color:var(--ink);cursor:pointer;}
  .seg button+button{border-left:1px solid var(--ink);}
  .seg button.on-av{background:var(--sage);color:var(--sage-ink);font-weight:400;}
  .seg button.on-off{background:var(--ink);color:var(--paper);}
  .booked-note{background:var(--blush);border:1.5px solid var(--burgundy);border-radius:10px;padding:16px 18px;}
  .booked-note .k{font-size:13px;color:var(--burgundy);}
  .booked-note .v{font-family:var(--serif);font-size:24px;color:var(--burgundy);}

  label.field{display:block;font-size:13px;color:var(--stone);margin-bottom:2px;}
  input[type=text],input[type=email],input[type=tel],textarea{width:100%;font-family:var(--sans);font-weight:300;font-size:16px;color:var(--ink);
    background:transparent;border:none;border-bottom:1px solid #CDBDB9;border-radius:0;padding:8px 0 9px;line-height:1.45;}
  textarea{min-height:64px;resize:vertical;}
  input:focus,textarea:focus{outline:none;border-bottom-color:var(--burgundy);}
  ::placeholder{color:#BCADA9;}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:22px 20px;}
  .fields .full{grid-column:1/-1;}
  @media(max-width:480px){.fields{grid-template-columns:1fr;} .hero h1{font-size:54px;}}

  /* Pay */
  .pay-total{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:6px 0 18px;}
  .pay-total .v{font-family:var(--serif);font-weight:300;font-size:58px;line-height:1;color:var(--burgundy);}
  .pay-total .k{color:var(--stone);font-size:14px;}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:14px 0;border-top:1px solid var(--hair);}
  .rows .row:last-child{border-bottom:1px solid var(--hair);}
  .row .sub{font-size:13px;color:var(--stone);}
  .row .amt{font-family:var(--serif);font-size:21px;white-space:nowrap;}

  /* Documents */
  .doc-name{font-family:var(--serif);font-size:22px;line-height:1.2;}
  .doc-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;}
  .w9-ok{font-size:13px;color:var(--sage-ink);} .w9-need{font-size:13px;color:var(--burgundy);}
  input[type=file]{display:none;}
  .note-line{font-size:13px;color:var(--stone);margin-top:10px;}

  .status{position:sticky;bottom:0;z-index:40;text-align:center;font-size:13px;color:var(--stone);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(246,238,236,0.96);border-top:1px solid var(--hair);margin-top:56px;}
  .status.err{color:var(--burgundy);}
  .status .link{margin-left:10px;}
  .message{max-width:560px;margin:0 auto;padding:80px 24px;font-family:var(--serif);font-style:italic;font-size:22px;color:var(--stone);}
  .footer{background:var(--ink);color:var(--paper);padding:36px 24px 44px;}
  .footer-inner{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .footer .b{font-family:var(--serif);font-style:italic;font-size:21px;}
  .footer .s{font-size:12px;color:rgba(246,238,236,0.5);}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important;}}
  /* Type weights: match the fonts loaded on every MKBeauty page (Cormorant 300/400/500, italic 400/500; Jost 300/400/500) */
  .brand,.hero h1 .last,.hero h1 span,.hero-meta .tier,.footer .b,.group,.month-title,.panel-date,.ev-name,.doc-name,.p-name,.a-name,.row .amt,.booked-note .v,.quiet,.message{font-weight:400;}
</style>
</head>
<body>

<div id="root"><div class="message">Loading your page...</div></div>

<div class="footer"><div class="footer-inner">
  <div class="b">MKBeauty Artistry</div>
  <div class="s">Private to you. Please don't share this link.</div>
</div></div>

<script>
/* =====================================================================
   CONFIG
   API_URL: the ArtistHub Web App URL. If it says PASTE_..., the page runs
   in preview mode with sample data and nothing is saved.
   ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbxWpmfN1OQy2hr9k31XFQZPLacv0NeL6jUGpTbdcJ-2RkyzSrJ-uiB2g7pIcZWrbzGQKQ/exec";
const STYLE_GUIDE_URL = "https://drive.google.com/file/d/1XXL5DYYefCEpOf1uuApap0TwMCpH32BD/view";
const MONTHS_AHEAD = 12;

const DEMO = API_URL.indexOf('PASTE_') === 0;
const CODE = new URLSearchParams(location.search).get('a') || (DEMO ? 'demo' : '');
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

let D = null;
let viewYear, viewMonth, selected = null, payOpen = false;
const today = new Date(); today.setHours(0,0,0,0);
const todayKey = keyOf(today);
const firstMonth = new Date(today.getFullYear(), today.getMonth(), 1);
const lastMonth = new Date(today.getFullYear(), today.getMonth() + MONTHS_AHEAD - 1, 1);

function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromKey(k){ const p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ const v = Number(n)||0; return '$' + v.toLocaleString('en-US', {minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits:2}); }
function niceDate(k){ const d = fromKey(k); return DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate(); }
function shortDate(k){ const d = fromKey(k); return MONTHS[d.getMonth()].slice(0,3) + ' ' + d.getDate(); }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }
async function post(payload){
  if (DEMO) { await new Promise(r => setTimeout(r, 600)); return { success:true, date: todayKey }; }
  const res = await fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({ code: CODE }, payload)) });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

/* ---------- Load ---------- */
async function load(){
  const root = document.getElementById('root');
  if (!CODE) { root.innerHTML = '<div class="message">This link is missing your personal code. Ask Morgan for your page link.</div>'; return; }
  try{
    if (DEMO) D = demoData();
    else {
      const res = await fetch(API_URL + '?a=' + encodeURIComponent(CODE));
      D = await res.json();
      if (D.error) { root.innerHTML = '<div class="message">This link isn\'t working. Ask Morgan for a fresh one.</div>'; return; }
    }
  }catch(e){
    root.innerHTML = '<div class="message">Your page didn\'t load. Check your connection and refresh.</div>'; return;
  }
  D.entries = D.entries || {}; D.booked = D.booked || {}; D.info = D.info || {};
  document.title = D.name + "'s Artist Page | MKBeauty";
  viewYear = firstMonth.getFullYear(); viewMonth = firstMonth.getMonth();
  render();
}

/* ---------- Page ---------- */
function render(){
  const parts = (D.legalName || D.name || '').trim().split(/\s+/);
  const first = D.name || parts[0] || '';
  const last = parts.length > 1 ? parts.slice(1).join(' ') : '';
  const services = String(D.services || D.role || '').split(/[,/]+/).map(s => s.trim()).filter(Boolean);
  const meta = [];
  if (D.tier) meta.push(`<span class="tier">${esc(D.tier)}</span>`);
  if (services.length) meta.push(`<span>${esc(services.join(' and '))}</span>`);
  if (D.homeBase) meta.push(`<span>${esc(D.homeBase)}</span>`);

  document.getElementById('root').innerHTML = `
  <header class="hero"><div class="hero-inner">
    <div class="brand">MKBeauty Artistry</div>
    <h1>${esc(first)}${last ? `<span class="last">${esc(last)}</span>` : ''}</h1>
    ${meta.length ? `<div class="hero-meta">${meta.join('')}</div>` : ''}
  </div></header>

  <nav class="nav" aria-label="Sections"><div class="nav-inner">
    <a href="#availability">Availability</a><a href="#upcoming">Upcoming</a><a href="#pay">Pay</a>
    <a href="#portfolio">Portfolio</a><a href="#documents">Documents</a><a href="#details">Your details</a>
  </div></nav>

  <section class="section" id="availability">
    <h2>Availability</h2>
    <p class="lede">Tap a date to mark it. Add a note if you need to. Changes save on their own.</p>
    <div class="cal">
      <div class="month-nav">
        <button id="prevBtn" aria-label="Previous month">&lsaquo;</button>
        <div class="month-title" id="monthTitle"></div>
        <button id="nextBtn" aria-label="Next month">&rsaquo;</button>
      </div>
      <div class="weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="legend">
      <span><i class="lg-av"></i>Available</span><span><i class="lg-off"></i>Unavailable</span>
      <span><i class="lg-bk"></i>Booked with MKB</span><span><i class="lg-note"></i>Has a note</span>
    </div>
    <div id="panel"></div>
  </section>

  <section class="section" id="upcoming">
    <h2>Upcoming</h2>
    <p class="lede">Your MKBeauty weddings over the next six weeks.</p>
    <div id="upcomingList"></div>
  </section>

  <section class="section" id="pay">
    <h2>Pay</h2>
    <p class="lede">Payouts marked paid to you this year.</p>
    <div id="payWrap"></div>
  </section>

  <section class="section" id="portfolio">
    <h2>Portfolio</h2>
    <p class="lede">Add your best recent work. Photos go straight into your MKBeauty portfolio, which we share with brides when they choose their team.</p>
    <div id="portfolioWrap"></div>
  </section>

  <section class="section" id="documents">
    <h2>Documents</h2>
    <div class="rows" id="docsWrap"></div>
  </section>

  <section class="section" id="details">
    <h2>Your details</h2>
    <p class="lede">Keep these current so we can always reach you. Changes save as you type.</p>
    <div class="fields" id="infoGrid"></div>
  </section>

  <div class="status" id="status">${DEMO ? 'Preview mode. Nothing is saved.' : 'All changes saved'}</div>`;

  renderUpcoming();
  document.getElementById('prevBtn').onclick = ()=> shiftMonth(-1);
  document.getElementById('nextBtn').onclick = ()=> shiftMonth(1);
  renderMonth(); renderPay(); renderPortfolio(); renderDocs(); renderInfo();
  watchNav();
}

function watchNav(){
  const links = Array.from(document.querySelectorAll('.nav a'));
  const map = new Map(links.map(a => [a.getAttribute('href').slice(1), a]));
  if (links[0]) links[0].classList.add('on');
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { links.forEach(l => l.classList.remove('on')); const a = map.get(e.target.id); if (a) { a.classList.add('on'); a.scrollIntoView({block:'nearest', inline:'nearest'}); } } });
  }, { rootMargin:'-45% 0px -50% 0px' });
  document.querySelectorAll('.section').forEach(s => io.observe(s));
}

/* ---------- Upcoming ---------- */
function renderUpcoming(){
  const wrap = document.getElementById('upcomingList');
  const list = D.upcoming || [];
  if (!list.length) { wrap.innerHTML = '<div class="quiet">Nothing on the books in the next six weeks.</div>'; return; }
  wrap.innerHTML = list.map(ev => {
    const d = fromKey(ev.date);
    const times = [ev.callTime ? `Call <b>${esc(ev.callTime)}</b>` : '', ev.ceremonyTime ? `ceremony ${esc(ev.ceremonyTime)}` : ''].filter(Boolean).join(', ');
    return `<div class="ev">
      <div><div class="ev-day">${d.getDate()}</div><div class="ev-mon">${MONTHS[d.getMonth()].slice(0,3)}, ${DAYS[d.getDay()].slice(0,3)}</div></div>
      <div>
        <div class="ev-name">${esc(ev.client)}</div>
        ${ev.venue ? `<div class="ev-line">${esc(ev.venue)}</div>` : ''}
        ${times ? `<div class="ev-line">${times}</div>` : ''}
        ${ev.gettingReady ? `<div class="ev-line">Getting ready at ${esc(ev.gettingReady)}</div>` : ''}
        ${ev.services && ev.services.length ? `<div class="ev-svc">${esc(ev.services.join(', '))}</div>` : ''}
        ${ev.briefUrl ? `<div class="actions"><a class="link" href="${esc(ev.briefUrl)}" target="_blank" rel="noopener">Open artist brief</a></div>` : ''}
      </div></div>`;
  }).join('');
}

/* ---------- Availability ---------- */
function shiftMonth(n){
  const d = new Date(viewYear, viewMonth + n, 1);
  if (d < firstMonth || d > lastMonth) return;
  viewYear = d.getFullYear(); viewMonth = d.getMonth(); selected = null;
  renderMonth();
}
function renderMonth(){
  document.getElementById('monthTitle').textContent = MONTHS[viewMonth] + ' ' + viewYear;
  const cur = new Date(viewYear, viewMonth, 1);
  document.getElementById('prevBtn').disabled = cur <= firstMonth;
  document.getElementById('nextBtn').disabled = cur >= lastMonth;
  const days = new Date(viewYear, viewMonth + 1, 0).getDate();
  let html = '';
  for (let i = 0; i < cur.getDay(); i++) html += '<div class="day blank"></div>';
  for (let d = 1; d <= days; d++){
    const date = new Date(viewYear, viewMonth, d), k = keyOf(date);
    const bk = D.booked[k], en = D.entries[k] || {};
    let cls = 'day', label = '';
    if (bk) { cls += ' bk'; label = 'booked'; }
    else if (en.status === 'Available') { cls += ' av'; label = 'available'; }
    else if (en.status === 'Unavailable') { cls += ' off'; label = 'unavailable'; }
    if (date < today) cls += ' past';
    if (k === todayKey) cls += ' today';
    if (k === selected) cls += ' selected';
    const dot = (!bk && en.note) ? '<span class="dot"></span>' : '';
    html += `<div class="${cls}" data-k="${k}" role="button" tabindex="${date < today ? -1 : 0}" aria-label="${esc(MONTHS[viewMonth]+' '+d+(label?', '+label:''))}"><span class="c">${d}</span>${bk ? '<span class="t">Booked</span>' : ''}${dot}</div>`;
  }
  const filled = cur.getDay() + days;
  for (let i = filled; i % 7 !== 0; i++) html += '<div class="day blank"></div>';
  const grid = document.getElementById('grid');
  grid.innerHTML = html;
  grid.querySelectorAll('.day[data-k]').forEach(el => {
    if (el.classList.contains('past')) return;
    const pick = ()=> { const k = el.getAttribute('data-k'); selected = selected === k ? null : k; renderMonth();
      if (selected) setTimeout(()=> document.getElementById('panel').scrollIntoView({behavior:'smooth', block:'nearest'}), 30); };
    el.onclick = pick;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
  });
  renderPanel();
}
function renderPanel(){
  const panel = document.getElementById('panel');
  if (!selected) { panel.innerHTML = ''; return; }
  const bk = D.booked[selected];
  if (bk) {
    panel.innerHTML = `<div class="panel"><div class="panel-date">${esc(niceDate(selected))}</div>

      <p class="note-line">Morgan manages booked dates. If something looks off, message her.</p></div>`;
    return;
  }
  const en = D.entries[selected] || { status:'', note:'' };
  panel.innerHTML = `<div class="panel"><div class="panel-date">${esc(niceDate(selected))}</div>
    <div class="seg" role="group" aria-label="Mark this day">
      <button id="btnAv" class="${en.status==='Available'?'on-av':''}" aria-pressed="${en.status==='Available'}">Available</button>
      <button id="btnOff" class="${en.status==='Unavailable'?'on-off':''}" aria-pressed="${en.status==='Unavailable'}">Unavailable</button>
    </div>
    <label class="field" for="noteBox">Note for this day</label>
    <textarea id="noteBox" maxlength="300" placeholder="Free until 2pm, can travel up to 2 hours">${esc(en.note || '')}</textarea>
    ${(en.status || en.note) ? '<div class="actions"><button class="link" id="clearBtn">Clear this day</button></div>' : ''}</div>`;
  document.getElementById('btnAv').onclick = ()=> setDay({ status: en.status === 'Available' ? '' : 'Available' });
  document.getElementById('btnOff').onclick = ()=> setDay({ status: en.status === 'Unavailable' ? '' : 'Unavailable' });
  const note = document.getElementById('noteBox');
  const saveNote = ()=> { const cur = D.entries[selected] || {}; if ((cur.note||'') !== note.value) setDay({ note: note.value }, true); };
  note.addEventListener('input', debounce(saveNote, 800));
  note.addEventListener('blur', saveNote);
  const clr = document.getElementById('clearBtn');
  if (clr) clr.onclick = ()=> setDay({ status:'', note:'' });
}
function setDay(change, quiet){
  const k = selected;
  const en = Object.assign({ status:'', note:'' }, D.entries[k] || {}, change);
  D.entries[k] = en;
  queue('day:' + k, { action:'artistSave', date:k, status: en.status, note: en.note });
  if (quiet) {
    const cell = document.querySelector('.day[data-k="' + k + '"]');
    if (cell) { const has = cell.querySelector('.dot'); if (en.note && !has) cell.insertAdjacentHTML('beforeend','<span class="dot"></span>'); if (!en.note && has) has.remove(); }
  } else renderMonth();
}

function renderPortfolio(){

    <input type="file" id="photoInput" accept="image/*" multiple>`;
  const input = document.getElementById('photoInput');
  document.getElementById('addPhotos').onclick = ()=> input.click();
  input.onchange = ()=> uploadPhotos(Array.from(input.files || []), input);
}
async function uploadPhotos(files, input){
  if (!files.length) return;
  const btn = document.getElementById('addPhotos'), st = document.getElementById('photoStatus');
  btn.disabled = true;
  let done = 0, failed = 0;
  for (const f of files){
    st.textContent = `Uploading ${done + failed + 1} of ${files.length}...`;
    try{ const dataUrl = await compress(f, 2400, 0.9); await post({ action:'uploadPortfolio', mimeType:'image/jpeg', data: dataUrl.split(',')[1] }); done++; }
    catch(e){ failed++; }
  }
  st.textContent = failed ? `${done} added. ${failed} didn't upload, so try those again.` : `${done} photo${done === 1 ? '' : 's'} added to your portfolio.`;
  btn.disabled = false; input.value = '';
}
function compress(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const r = new FileReader(); r.onerror = reject;
    r.onload = e => { const img = new Image(); img.onerror = reject;
      img.onload = () => { let w = img.width, h = img.height; const s = Math.min(1, maxDim / Math.max(w, h)); w = Math.round(w*s); h = Math.round(h*s);
        const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); resolve(c.toDataURL('image/jpeg', quality)); };
      img.src = e.target.result; };
    r.readAsDataURL(file);
  });
}

async function uploadW9(input){
  const f = input.files && input.files[0];
  if (!f) return;
  const btn = document.getElementById('w9Btn'), sub = document.getElementById('w9Sub');
  if (f.size > 15 * 1024 * 1024) { sub.textContent = 'That file is too large. Try a smaller PDF or photo.'; input.value=''; return; }
  btn.disabled = true; btn.textContent = 'Uploading...';
  try{
    const isImg = /^image\//.test(f.type);
    const dataUrl = isImg ? await compress(f, 2400, 0.92) : await readAsDataUrl(f);
    const res = await post({ action:'uploadW9', mimeType: isImg ? 'image/jpeg' : 'application/pdf', data: dataUrl.split(',')[1] });
    D.w9 = { received:true, date: res.date || todayKey };
    renderDocs();
  }catch(e){ sub.textContent = "That didn't upload. Try again in a moment."; btn.disabled = false; btn.textContent = 'Upload'; }
  input.value = '';
}
function readAsDataUrl(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }

/* ---------- Saving queue (one pending save per item, sent in order) ---------- */
const pending = {};
let sending = false;
function queue(key, payload){ pending[key] = payload; bar('saving'); flush(); }
async function flush(){
  if (sending) return;
  sending = true;
  let failed = false;
  while (Object.keys(pending).length){
    const k = Object.keys(pending)[0], p = pending[k];
    try { await post(p); if (pending[k] === p) delete pending[k]; }
    catch(e){ failed = true; break; }
  }
  sending = false;
  bar(failed ? 'error' : (Object.keys(pending).length ? 'saving' : 'saved'));
}
function bar(mode){
  const el = document.getElementById('status'); if (!el) return;
  el.classList.toggle('err', mode === 'error');
  if (mode === 'saving') el.textContent = 'Saving...';
  else if (mode === 'saved') el.textContent = DEMO ? 'Preview mode. Nothing is saved.' : 'All changes saved';
  else { el.innerHTML = 'Not saved yet.<button class="link" id="retryBtn">Try again</button>'; document.getElementById('retryBtn').onclick = flush; }
}
window.addEventListener('beforeunload', e => { if (Object.keys(pending).length) { e.preventDefault(); e.returnValue = ''; } });
