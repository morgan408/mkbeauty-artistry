<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MKB Artist">
<meta name="robots" content="noindex, nofollow">
<title>Artist Page | MKBeauty</title>
<meta property="og:title" content="Your Artist Page | MKBeauty">
<meta property="og:description" content="Your bookings, availability, pay, and documents in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#DCD9D4; --warm-white:#E0DDD9; --parchment:#E7E4DF;
    --ink:#191714; --muted:#797672; --border:#CBC5BE;
    --accent-dark:#AC9A8A; --accent-light:#EFEAE5; --burgundy:#632B37;
    --avail-bg:#D3E2CC; --avail-ink:#35522F; --avail-line:#93B08A;
    --off-bg:#7A7672; --off-ink:#F2EFEB;
    --booked-bg:#F1DCE0; --booked-ink:#632B37; --booked-line:#632B37;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;background:var(--cream);}
  body{font-family:'Jost',sans-serif;font-weight:300;color:var(--ink);-webkit-tap-highlight-color:transparent;}
  em{font-style:italic;color:var(--burgundy);}
  a{color:inherit;}

  .navbar{position:sticky;top:0;z-index:50;background:rgba(220,217,212,0.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
    padding:10px 16px;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .navbar a{flex:0 0 auto;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:10px 14px;
    border-radius:20px;border:1px solid var(--border);white-space:nowrap;min-height:36px;display:flex;align-items:center;}

  .hero{background:radial-gradient(ellipse at top,#2a2420 0%,var(--ink) 60%);color:var(--cream);text-align:center;padding:44px 20px 34px;}
  .eyebrow{font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:12px;}
  .hero h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:38px;margin:0;line-height:1.15;}
  .hero h1 em{color:var(--accent-dark);}
  .divider{width:50px;height:1px;background:var(--accent-dark);margin:16px auto;}
  .hero-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .hero-tags span{border:1px solid rgba(172,154,138,0.5);border-radius:14px;padding:7px 13px;font-size:12px;letter-spacing:0.05em;color:rgba(220,217,212,0.9);}
  .hero-tags .tier{border-color:var(--accent-dark);color:var(--cream);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;letter-spacing:0;padding:5px 14px;}

  .section{padding:36px 16px;max-width:620px;margin:0 auto;scroll-margin-top:64px;}
  .section-label{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--burgundy);display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--border);}
  .section-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:400;margin:0 0 6px;}
  .section-hint{font-size:13px;color:var(--muted);font-style:italic;margin:0 0 18px;line-height:1.5;}

  .card{background:var(--warm-white);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:12px;}
  .card.featured{background:var(--parchment);border-color:var(--burgundy);}
  .empty{border:1px dashed var(--accent-dark);border-radius:10px;padding:20px;text-align:center;color:var(--accent-dark);
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;line-height:1.5;}

  /* Upcoming */
  .ev-date{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--burgundy);margin-bottom:4px;}
  .ev-name{font-family:'Cormorant Garamond',serif;font-size:24px;margin-bottom:4px;}
  .ev-line{font-size:13px;color:var(--muted);line-height:1.55;}
  .ev-line b{font-weight:500;color:var(--ink);}
  .ev-services{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .ev-services span{font-size:11px;letter-spacing:0.05em;padding:5px 10px;border-radius:12px;background:var(--booked-bg);color:var(--booked-ink);border:1px solid var(--booked-line);}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:'Jost';font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
    text-decoration:none;border-radius:22px;padding:12px 20px;min-height:44px;cursor:pointer;border:1px solid var(--burgundy);background:var(--burgundy);color:var(--cream);}
  .btn.ghost{background:transparent;color:var(--burgundy);}
  .btn.small{font-size:11px;padding:8px 14px;min-height:36px;border-radius:18px;}
  .btn:disabled{opacity:0.5;cursor:default;}
  .btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}

  /* Calendar */
  .legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px;}
  .legend span{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;padding:6px 10px;border-radius:12px;border:1px solid transparent;}
  .lg-av{background:var(--avail-bg);color:var(--avail-ink);border-color:var(--avail-line)!important;}
  .lg-off{background:var(--off-bg);color:var(--off-ink);}
  .lg-bk{background:var(--booked-bg);color:var(--booked-ink);border-color:var(--booked-line)!important;}
  .lg-none{background:var(--warm-white);color:var(--muted);border-color:var(--border)!important;}
  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .month-nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--warm-white);font-size:20px;color:var(--ink);cursor:pointer;}
  .month-nav button:disabled{opacity:0.3;cursor:default;}
  .month-title{font-family:'Cormorant Garamond',serif;font-size:26px;}
  .weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
  .weekdays div{text-align:center;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);padding-bottom:4px;}
  .day{position:relative;aspect-ratio:1/1.05;border-radius:9px;border:1px solid var(--border);background:var(--warm-white);display:flex;flex-direction:column;
    align-items:center;justify-content:center;cursor:pointer;user-select:none;padding:2px;}
  .day .n{font-size:16px;line-height:1;}
  .day .t{font-size:9px;letter-spacing:0.04em;text-transform:uppercase;margin-top:3px;line-height:1;white-space:nowrap;overflow:hidden;max-width:100%;}
  .day.blank{visibility:hidden;}
  .day.past{opacity:0.35;cursor:default;}
  .day.av{background:var(--avail-bg);border-color:var(--avail-line);color:var(--avail-ink);}
  .day.off{background:var(--off-bg);border-color:var(--off-bg);color:var(--off-ink);}
  .day.bk{background:var(--booked-bg);border:1.5px solid var(--booked-line);color:var(--booked-ink);}
  .day.today .n{text-decoration:underline;text-underline-offset:3px;}
  .day.selected{outline:2px solid var(--ink);outline-offset:1px;}
  .day .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0.7;}
  .day:not(.av):not(.off):not(.bk) .dot{background:var(--burgundy);}
  .panel{margin-top:16px;background:var(--parchment);border:1px solid var(--burgundy);border-radius:12px;padding:18px;}
  .panel-date{font-family:'Cormorant Garamond',serif;font-size:24px;margin-bottom:12px;}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .choice button{min-height:50px;border-radius:24px;font-family:'Jost';font-size:13px;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;
    border:1px solid var(--border);background:var(--warm-white);color:var(--ink);}
  .choice button.on-av{background:var(--avail-bg);border-color:var(--avail-ink);color:var(--avail-ink);font-weight:500;}
  .choice button.on-off{background:var(--off-bg);border-color:var(--off-bg);color:var(--off-ink);font-weight:500;}
  .booked-box{background:var(--booked-bg);border:1.5px solid var(--booked-line);border-radius:10px;padding:16px;color:var(--booked-ink);}
  .booked-box .k{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:4px;}
  .booked-box .v{font-family:'Cormorant Garamond',serif;font-size:22px;}
  .link-btn{background:none;border:none;color:var(--burgundy);font-family:'Jost';font-size:12px;letter-spacing:0.06em;text-transform:uppercase;padding:10px 0 0;cursor:pointer;}

  /* Fields */
  label.field{display:block;font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  input[type=text],input[type=email],input[type=tel],textarea{width:100%;font-family:'Jost';font-weight:300;font-size:16px;color:var(--ink);
    background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:11px 12px;line-height:1.45;}
  textarea{min-height:74px;resize:vertical;}
  input:focus,textarea:focus{outline:none;border-color:var(--accent-dark);background:var(--warm-white);}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .info-grid .full{grid-column:1/-1;}
  @media(max-width:520px){.info-grid{grid-template-columns:1fr;}}

  /* Pay */
  .pay-total{text-align:center;background:var(--ink);color:var(--cream);border-radius:12px;padding:24px 18px;margin-bottom:12px;}
  .pay-total .k{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(220,217,212,0.6);margin-bottom:6px;}
  .pay-total .v{font-family:'Cormorant Garamond',serif;font-size:42px;}
  .pay-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .pay-row:last-child{border-bottom:none;}
  .pay-row .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .pay-row .amt{font-family:'Cormorant Garamond',serif;font-size:19px;white-space:nowrap;}

  /* Documents */
  .doc-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);}
  .doc-row:last-child{border-bottom:none;}
  .doc-name{font-family:'Cormorant Garamond',serif;font-size:20px;}
  .doc-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .pill{display:inline-block;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;padding:5px 10px;border-radius:12px;}
  .pill.ok{background:var(--avail-bg);color:var(--avail-ink);border:1px solid var(--avail-line);}
  .pill.wait{background:var(--booked-bg);color:var(--booked-ink);border:1px solid var(--booked-line);}
  input[type=file]{display:none;}

  .status{position:sticky;bottom:0;z-index:40;padding:11px 16px calc(11px + env(safe-area-inset-bottom));background:rgba(220,217,212,0.95);backdrop-filter:blur(6px);
    border-top:1px solid var(--border);font-size:13px;text-align:center;color:var(--muted);}
  .status.err{color:var(--burgundy);}
  .status button{margin-left:8px;background:var(--burgundy);color:var(--cream);border:none;border-radius:16px;padding:7px 14px;font-family:'Jost';font-size:12px;
    letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;}
  .message{text-align:center;padding:60px 20px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;color:var(--muted);line-height:1.5;}
  .footer{background:var(--ink);color:var(--cream);text-align:center;padding:30px 20px 36px;}
  .footer .brand{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;}
  .footer .sub{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(232,228,223,0.55);margin-top:6px;}
  .footer .internal{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent-dark);margin-top:10px;}
</style>
</head>
<body>

<div id="root"><div class="message">Loading your page...</div></div>

<div class="footer">
  <div class="brand">MKBeauty Artistry</div>
  <div class="sub">Morgan Kelly Baird</div>
  <div class="internal">Artist Page &middot; Internal Use Only</div>
</div>

<script>
/* =====================================================================
   CONFIG
   API_URL: the ArtistHub Web App URL. While it still says PASTE_..., the
   page runs in preview mode with sample data so nothing is saved.
   ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbxWpmfN1OQy2hr9k31XFQZPLacv0NeL6jUGpTbdcJ-2RkyzSrJ-uiB2g7pIcZWrbzGQKQ/exec";
const STYLE_GUIDE_URL = "https://drive.google.com/file/d/1XXL5DYYefCEpOf1uuApap0TwMCpH32BD/view";
const MONTHS_AHEAD = 12;

const DEMO = API_URL.indexOf('PASTE_') === 0;
const CODE = new URLSearchParams(location.search).get('a') || (DEMO ? 'demo' : '');
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

let D = null;                 // everything from the backend
let viewYear, viewMonth, selected = null, payOpen = false;
const today = new Date(); today.setHours(0,0,0,0);
const todayKey = keyOf(today);
const firstMonth = new Date(today.getFullYear(), today.getMonth(), 1);
const lastMonth = new Date(today.getFullYear(), today.getMonth() + MONTHS_AHEAD - 1, 1);

function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromKey(k){ const p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return '$' + (Number(n)||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function niceDate(k, withYear){ const d = fromKey(k); return DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + (withYear ? ', ' + d.getFullYear() : ''); }
function shortDate(k){ const d = fromKey(k); return MONTHS[d.getMonth()].slice(0,3) + ' ' + d.getDate(); }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }
async function post(payload){
  if (DEMO) { await new Promise(r => setTimeout(r, 600)); return { success:true, date: todayKey }; }
  const res = await fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({ code: CODE }, payload)) });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

/* ---------- Load ---------- */
async function load(){
  const root = document.getElementById('root');
  if (!CODE) { root.innerHTML = '<div class="message">This link is missing your personal code. Ask Morgan for your page link.</div>'; return; }
  try{
    if (DEMO) D = demoData();
    else {
      const res = await fetch(API_URL + '?a=' + encodeURIComponent(CODE));
      D = await res.json();
      if (D.error) { root.innerHTML = '<div class="message">This link isn\'t working. Ask Morgan for a fresh one.</div>'; return; }
    }
  }catch(e){
    root.innerHTML = '<div class="message">Couldn\'t load your page. Check your connection and refresh.</div>'; return;
  }
  D.entries = D.entries || {}; D.booked = D.booked || {}; D.info = D.info || {};
  document.title = D.name + "'s Artist Page | MKBeauty";
  viewYear = firstMonth.getFullYear(); viewMonth = firstMonth.getMonth();
  render();
}

/* ---------- Page ---------- */
function render(){
  const legal = (D.legalName || D.name || '').split(' ');
  const first = D.name || legal[0];
  const rest = legal.length > 1 ? legal.slice(1).join(' ') : '';
  const tags = [];
  if (D.tier) tags.push(`<span class="tier">${esc(D.tier)}</span>`);
  (String(D.services || D.role || '').split(/[,/]+/)).map(s => s.trim()).filter(Boolean).forEach(s => tags.push(`<span>${esc(s)}</span>`));
  if (D.homeBase) tags.push(`<span>${esc(D.homeBase)}</span>`);

  document.getElementById('root').innerHTML = `
  <div class="hero">
    <div class="eyebrow">MKBeauty Artistry &middot; Artist Page</div>
    <h1><em>${esc(first)}</em> ${esc(rest)}</h1>
    <div class="divider"></div>
    <div class="hero-tags">${tags.join('')}</div>
  </div>
  <nav class="navbar">
    <a href="#upcoming">Upcoming</a><a href="#availability">Availability</a><a href="#pay">Pay</a>
    <a href="#portfolio">Portfolio</a><a href="#documents">Documents</a><a href="#info">My Info</a>
  </nav>

  <div class="section" id="upcoming">
    <div class="section-label">I</div>
    <h2 class="section-title">Upcoming <em>Bookings</em></h2>
    <p class="section-hint">Your MKBeauty events over the next six weeks.</p>
    <div id="upcomingList"></div>
  </div>

  <div class="section" id="availability">
    <div class="section-label">II</div>
    <h2 class="section-title">My <em>Availability</em></h2>
    <p class="section-hint">Tap a date to mark it, and add a note if you need to. Everything saves on its own.</p>
    <div class="legend"><span class="lg-av">Available</span><span class="lg-off">Unavailable</span><span class="lg-bk">Booked with MKB</span><span class="lg-none">Not marked</span></div>
    <div class="month-nav">
      <button id="prevBtn" aria-label="Previous month">&#8249;</button>
      <div class="month-title" id="monthTitle"></div>
      <button id="nextBtn" aria-label="Next month">&#8250;</button>
    </div>
    <div class="weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
    <div class="grid" id="grid"></div>
    <div id="panel"></div>
  </div>

  <div class="section" id="pay">
    <div class="section-label">III</div>
    <h2 class="section-title">My <em>Pay</em></h2>
    <p class="section-hint">Everything marked paid to you in ${esc(D.pay ? D.pay.year : today.getFullYear())}.</p>
    <div id="payWrap"></div>
  </div>

  <div class="section" id="portfolio">
    <div class="section-label">IV</div>
    <h2 class="section-title">My <em>Portfolio</em></h2>
    <p class="section-hint">Add your best recent work. Photos go straight into your MKBeauty portfolio.</p>
    <div class="card featured" id="portfolioCard"></div>
  </div>

  <div class="section" id="documents">
    <div class="section-label">V</div>
    <h2 class="section-title"><em>Documents</em></h2>
    <div class="card" id="docsCard"></div>
  </div>

  <div class="section" id="info">
    <div class="section-label">VI</div>
    <h2 class="section-title">My <em>Info</em></h2>
    <p class="section-hint">Keep this current so we can always reach you. Changes save as you type.</p>
    <div class="card"><div class="info-grid" id="infoGrid"></div></div>
  </div>

  <div class="status" id="status">${DEMO ? 'Preview mode, nothing is saved' : 'All changes saved'}</div>`;

  renderUpcoming();
  document.getElementById('prevBtn').onclick = ()=> shiftMonth(-1);
  document.getElementById('nextBtn').onclick = ()=> shiftMonth(1);
  renderMonth();
  renderPay();
  renderPortfolio();
  renderDocs();
  renderInfo();
}

/* ---------- I. Upcoming ---------- */
function renderUpcoming(){
  const wrap = document.getElementById('upcomingList');
  const list = D.upcoming || [];
  if (!list.length) { wrap.innerHTML = '<div class="empty">Nothing on the books in the next six weeks.</div>'; return; }
  wrap.innerHTML = list.map(ev => `
    <div class="card featured">
      <div class="ev-date">${esc(niceDate(ev.date, true))}</div>
      <div class="ev-name">${esc(ev.client)}</div>
      ${ev.venue ? `<div class="ev-line">${esc(ev.venue)}</div>` : ''}
      ${ev.callTime ? `<div class="ev-line">Call time <b>${esc(ev.callTime)}</b>${ev.ceremonyTime ? ` &middot; Ceremony ${esc(ev.ceremonyTime)}` : ''}</div>` : ''}
      ${ev.gettingReady ? `<div class="ev-line">Getting ready at ${esc(ev.gettingReady)}</div>` : ''}
      ${ev.services && ev.services.length ? `<div class="ev-services">${ev.services.map(s => `<span>${esc(s)}</span>`).join('')}</div>` : ''}
      ${ev.briefUrl ? `<div class="btn-row"><a class="btn" href="${esc(ev.briefUrl)}" target="_blank" rel="noopener">Open Artist Brief</a></div>` : ''}
    </div>`).join('');
}

/* ---------- II. Availability ---------- */
function shiftMonth(n){
  const d = new Date(viewYear, viewMonth + n, 1);
  if (d < firstMonth || d > lastMonth) return;
  viewYear = d.getFullYear(); viewMonth = d.getMonth(); selected = null;
  renderMonth();
}
function renderMonth(){
  document.getElementById('monthTitle').textContent = MONTHS[viewMonth] + ' ' + viewYear;
  const cur = new Date(viewYear, viewMonth, 1);
  document.getElementById('prevBtn').disabled = cur <= firstMonth;
  document.getElementById('nextBtn').disabled = cur >= lastMonth;
  const days = new Date(viewYear, viewMonth + 1, 0).getDate();
  let html = '';
  for (let i = 0; i < cur.getDay(); i++) html += '<div class="day blank"></div>';
  for (let d = 1; d <= days; d++){
    const date = new Date(viewYear, viewMonth, d), k = keyOf(date);
    const bk = D.booked[k], en = D.entries[k] || {};
    let cls = 'day', tag = '';
    if (bk) { cls += ' bk'; tag = 'Booked'; }
    else if (en.status === 'Available') { cls += ' av'; tag = 'Avail'; }
    else if (en.status === 'Unavailable') { cls += ' off'; tag = 'Off'; }
    if (date < today) cls += ' past';
    if (k === todayKey) cls += ' today';
    if (k === selected) cls += ' selected';
    const dot = (!bk && en.note) ? '<span class="dot"></span>' : '';
    html += `<div class="${cls}" data-k="${k}" role="button" aria-label="${esc(MONTHS[viewMonth]+' '+d+(tag?', '+tag:''))}">${dot}<span class="n">${d}</span><span class="t">${tag}</span></div>`;
  }
  const grid = document.getElementById('grid');
  grid.innerHTML = html;
  grid.querySelectorAll('.day[data-k]').forEach(el => {
    if (el.classList.contains('past')) return;
    el.onclick = ()=> { const k = el.getAttribute('data-k'); selected = selected === k ? null : k; renderMonth();
      if (selected) setTimeout(()=> document.getElementById('panel').scrollIntoView({behavior:'smooth', block:'nearest'}), 30); };
  });
  renderPanel();
}
function renderPanel(){
  const panel = document.getElementById('panel');
  if (!selected) { panel.innerHTML = ''; return; }
  const title = niceDate(selected);
  const bk = D.booked[selected];
  if (bk) {
    panel.innerHTML = `<div class="panel"><div class="panel-date">${esc(title)}</div>
      <div class="booked-box"><div class="k">Booked with MKBeauty</div><div class="v">${esc(bk.label || 'Booked')}</div></div>
      <p class="section-hint" style="margin:10px 0 0;">Morgan manages booked dates. If something looks off, message her.</p></div>`;
    return;
  }
  const en = D.entries[selected] || { status:'', note:'' };
  panel.innerHTML = `<div class="panel"><div class="panel-date">${esc(title)}</div>
    <div class="choice">
      <button id="btnAv" class="${en.status==='Available'?'on-av':''}">Available</button>
      <button id="btnOff" class="${en.status==='Unavailable'?'on-off':''}">Unavailable</button>
    </div>
    <label class="field" for="noteBox">Note for this day (optional)</label>
    <textarea id="noteBox" maxlength="300" placeholder="Free until 2pm, can travel up to 2 hours...">${esc(en.note || '')}</textarea>
    ${(en.status || en.note) ? '<button class="link-btn" id="clearBtn">Clear this day</button>' : ''}</div>`;
  document.getElementById('btnAv').onclick = ()=> setDay({ status: en.status === 'Available' ? '' : 'Available' });
  document.getElementById('btnOff').onclick = ()=> setDay({ status: en.status === 'Unavailable' ? '' : 'Unavailable' });
  const note = document.getElementById('noteBox');
  const saveNote = ()=> { const cur = D.entries[selected] || {}; if ((cur.note||'') !== note.value) setDay({ note: note.value }, true); };
  note.addEventListener('input', debounce(saveNote, 800));
  note.addEventListener('blur', saveNote);
  const clr = document.getElementById('clearBtn');
  if (clr) clr.onclick = ()=> setDay({ status:'', note:'' });
}
function setDay(change, quiet){
  const k = selected;
  const en = Object.assign({ status:'', note:'' }, D.entries[k] || {}, change);
  D.entries[k] = en;
  queue('day:' + k, { action:'artistSave', date:k, status: en.status, note: en.note });
  if (quiet) {
    const cell = document.querySelector('.day[data-k="' + k + '"]');
    if (cell) { const has = cell.querySelector('.dot'); if (en.note && !has) cell.insertAdjacentHTML('afterbegin','<span class="dot"></span>'); if (!en.note && has) has.remove(); }
  } else renderMonth();
}

    <input type="file" id="photoInput" accept="image/*" multiple>`;
  const input = document.getElementById('photoInput');
  document.getElementById('addPhotos').onclick = ()=> input.click();

async function uploadPhotos(files, input){
  if (!files.length) return;
  const btn = document.getElementById('addPhotos'), st = document.getElementById('photoStatus');
  btn.disabled = true;
  let done = 0, failed = 0;
  for (const f of files){
    st.textContent = `Uploading ${done + failed + 1} of ${files.length}...`;
    try{
      const dataUrl = await compress(f, 2400, 0.9);
      await post({ action:'uploadPortfolio', mimeType:'image/jpeg', data: dataUrl.split(',')[1] });
      done++;
    }catch(e){ failed++; }
  }
  st.textContent = failed ? `${done} added, ${failed} didn't upload. Try those again.` : `${done} photo${done === 1 ? '' : 's'} added to your portfolio.`;
  btn.disabled = false; input.value = '';
}
function compress(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = reject;
    r.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let w = img.width, h = img.height;
        const s = Math.min(1, maxDim / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}

async function uploadW9(input){
  const f = input.files && input.files[0];
  if (!f) return;
  const btn = document.getElementById('w9Btn'), sub = document.getElementById('w9Sub');
  if (f.size > 15 * 1024 * 1024) { sub.textContent = 'That file is too large. Try a smaller PDF or photo.'; input.value=''; return; }
  btn.disabled = true; btn.textContent = 'Uploading...';
  try{
    const isImg = /^image\//.test(f.type);
    const dataUrl = isImg ? await compress(f, 2400, 0.92) : await readAsDataUrl(f);
    const res = await post({ action:'uploadW9', mimeType: isImg ? 'image/jpeg' : 'application/pdf', data: dataUrl.split(',')[1] });
    D.w9 = { received:true, date: res.date || todayKey };
    renderDocs();
  }catch(e){
    sub.textContent = "That didn't upload. Try again in a moment.";
    btn.disabled = false; btn.textContent = 'Upload';
  }
  input.value = '';
}
function readAsDataUrl(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }

/* ---------- Saving queue (one pending save per item, sent in order) ---------- */
const pending = {};
let sending = false;
function queue(key, payload){ pending[key] = payload; bar('saving'); flush(); }
async function flush(){
  if (sending) return;
  sending = true;
  let failed = false;
  while (Object.keys(pending).length){
    const k = Object.keys(pending)[0], p = pending[k];
    try { await post(p); if (pending[k] === p) delete pending[k]; }
    catch(e){ failed = true; break; }
  }
  sending = false;
  bar(failed ? 'error' : (Object.keys(pending).length ? 'saving' : 'saved'));
}
function bar(mode){
  const el = document.getElementById('status'); if (!el) return;
  el.classList.toggle('err', mode === 'error');
  if (mode === 'saving') el.textContent = 'Saving...';
  else if (mode === 'saved') el.textContent = DEMO ? 'Preview mode, nothing is saved' : 'All changes saved';
  else { el.innerHTML = 'Not saved yet. <button id="retryBtn">Try again</button>'; document.getElementById('retryBtn').onclick = flush; }
}
window.addEventListener('beforeunload', e => { if (Object.keys(pending).length) { e.preventDefault(); e.returnValue = ''; } });
