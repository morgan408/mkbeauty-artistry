<!DOCTYPE html>
<html lang="en" data-theme="cream">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MKB Artist">
<meta name="robots" content="noindex, nofollow">
<title>Artist Page | MKBeauty</title>
<meta property="og:title" content="Your Artist Page | MKBeauty">
<meta property="og:description" content="Your bookings, availability, pay, and documents in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* Brand palette, matched to mkbeauty-artistry.vercel.app */
  :root{
    --cream:#E8E4DF; --parchment:#DDD9D4; --warm-white:#EDEBE8; --ink:#1A1714; --text-2:#4A4541;
    --border:#CCC8C3; --tan:#B09A88; --tan-dark:#6B5446; --burgundy:#6B2737; --pink:#D9AEB5;
    --sage:#DCE3D3; --sage-line:#B7C4AB;
    --serif:'Cormorant Garamond',serif; --sans:'Jost',sans-serif;
  }
  /* Option A: Cream. Closest to the main site's hero. */
  [data-theme="cream"]{
    --page:var(--cream); --surface:var(--warm-white); --hero-bg:var(--parchment); --hero-ink:var(--ink);
    --hero-accent:var(--burgundy); --hero-line:var(--tan); --eyebrow:var(--burgundy);
    --primary:var(--ink); --on-primary:var(--cream);
    --bk-bg:var(--burgundy); --bk-ink:var(--cream); --bk-line:var(--burgundy);
    --frame:var(--tan); --cal-head:var(--ink); --cal-head-ink:var(--cream);
  }
  /* Option B: Burgundy header, blush booked days. */
  [data-theme="burgundy"]{
    --page:var(--cream); --surface:var(--warm-white); --hero-bg:var(--burgundy); --hero-ink:var(--cream);
    --hero-accent:var(--pink); --hero-line:var(--pink); --eyebrow:var(--burgundy);
    --primary:var(--burgundy); --on-primary:var(--cream);
    --bk-bg:#F0DEDF; --bk-ink:var(--burgundy); --bk-line:var(--burgundy);
    --frame:var(--burgundy); --cal-head:var(--burgundy); --cal-head-ink:var(--cream);
  }
  /* Option C: Ink, like the main site's pricing section and footer. */
  [data-theme="ink"]{
    --page:var(--cream); --surface:var(--warm-white); --hero-bg:var(--ink); --hero-ink:var(--cream);
    --hero-accent:var(--tan); --hero-line:var(--tan); --eyebrow:var(--burgundy);
    --primary:var(--ink); --on-primary:var(--cream);
    --bk-bg:var(--pink); --bk-ink:var(--ink); --bk-line:var(--burgundy);
    --frame:var(--tan); --cal-head:var(--ink); --cal-head-ink:var(--cream);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;background:var(--page);}
  body{font-family:var(--sans);font-weight:300;color:var(--ink);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
  a{color:inherit;} button{font-family:var(--sans);}
  em{font-style:italic;}
  :focus-visible{outline:2px solid var(--tan-dark);outline-offset:3px;}

  .eyebrow{font-size:11.5px;letter-spacing:0.24em;text-transform:uppercase;color:var(--eyebrow);margin:0 0 12px;font-weight:400;}
  .divider{width:48px;height:1px;background:var(--tan);margin:18px 0 20px;}
  h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.15;margin:0;}
  h2 em{color:var(--burgundy);}

  .hero{background:var(--hero-bg);color:var(--hero-ink);padding:52px 24px 38px;}
  .inner{max-width:600px;margin:0 auto;}
  .hero .eyebrow{color:var(--hero-accent);}
  .hero h1{font-size:46px;}
  .hero h1 em{color:var(--hero-accent);}
  .hero .divider{background:var(--hero-line);}
  .tags{display:flex;flex-wrap:wrap;gap:8px;}
  .tag{display:inline-flex;align-items:center;padding:7px 14px;border-radius:999px;border:1px solid var(--hero-line);font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;font-weight:400;color:var(--hero-ink);}
  .tag.tier{font-family:var(--serif);font-style:italic;font-size:16px;letter-spacing:0;text-transform:none;padding:4px 16px;}

  .pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 24px;border-radius:999px;cursor:pointer;
    font-family:var(--sans);font-size:12px;letter-spacing:0.1em;text-transform:uppercase;font-weight:500;text-decoration:none;
    background:transparent;border:1px solid var(--ink);color:var(--ink);transition:background .2s,color .2s;}
  .pill:hover{background:var(--ink);color:var(--cream);}
  .pill.solid{background:var(--primary);border-color:var(--primary);color:var(--on-primary);}
  .pill.small{min-height:36px;padding:0 16px;font-size:11px;}
  .pill:disabled{opacity:0.5;cursor:default;}
  .pill-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;}

  .nav{position:sticky;top:0;z-index:50;background:rgba(232,228,223,0.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);}
  .nav-inner{max-width:600px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:10px 24px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .nav-inner::-webkit-scrollbar{display:none;}
  .nav a{flex:0 0 auto;display:inline-flex;align-items:center;min-height:34px;padding:0 15px;border-radius:999px;border:1px solid var(--border);
    font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:500;color:var(--text-2);text-decoration:none;}
  .nav a.on{background:var(--ink);border-color:var(--ink);color:var(--cream);}

  .section{max-width:600px;margin:0 auto;padding:48px 24px 8px;scroll-margin-top:60px;}
  .section h2{font-size:32px;}
  .lede{color:var(--text-2);margin:0 0 22px;}
  .card{background:var(--surface);border:1px solid var(--border);padding:22px 20px;margin-bottom:12px;}
  .quiet{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--text-2);padding:4px 0;}

  /* Calendar, framed with the corner brackets from the main site's pricing section */
  .frame{position:relative;background:var(--surface);border:1px solid var(--border);padding:16px 12px 14px;}
  .frame::before,.frame::after{content:"";position:absolute;width:18px;height:18px;border:1px solid var(--frame);z-index:1;}
  .frame::before{top:-1px;left:-1px;border-right:none;border-bottom:none;display:none;}
  .frame::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
  .month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--cal-head);color:var(--cal-head-ink);margin:-16px -12px 10px;padding:8px 10px;}
  .month-title{font-family:var(--serif);font-size:24px;}
  .arrow{width:38px;height:38px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;opacity:0.85;}
  .arrow:disabled{opacity:0.25;cursor:default;}
  .weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
  .weekdays div{text-align:center;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-2);padding:2px 0 6px;font-weight:400;}
  .day{position:relative;aspect-ratio:1/1.05;border-radius:10px;border:1px solid var(--border);background:#F6F4F1;cursor:pointer;user-select:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);}
  .day .c{font-size:15px;line-height:1;}
  .day .t{font-size:9.5px;margin-top:4px;line-height:1;font-weight:400;}
  .day.blank{visibility:hidden;}
  .day.past{cursor:default;background:transparent;border-color:transparent;color:var(--text-2);opacity:0.55;}
  .day.av{background:var(--sage);border-color:var(--sage-line);}
  .day.off{background:var(--parchment);border-color:var(--parchment);}
  .day.off .c{text-decoration:line-through;}
  .day.bk{background:var(--bk-bg);border-color:var(--bk-line);color:var(--bk-ink);}
  .day.bk .c{font-weight:500;}
  .day.today .c{font-weight:500;border-bottom:1px solid currentColor;padding-bottom:2px;}
  .day.selected{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--ink);}
  .day .dot{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--burgundy);}
  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:12.5px;color:var(--text-2);}
  .legend span{display:inline-flex;align-items:center;gap:7px;}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid transparent;}
  .lg-av{background:var(--sage);border-color:var(--sage-line)!important;} .lg-off{background:var(--parchment);}
  .lg-bk{background:var(--bk-bg);border-color:var(--bk-line)!important;}
  .lg-note{width:5px!important;height:5px!important;border-radius:50%!important;background:var(--burgundy);}

  .panel{margin-top:18px;}
  .panel-date{font-family:var(--serif);font-size:24px;margin-bottom:14px;}
  .choice{display:flex;gap:8px;margin-bottom:18px;}
  .choice .pill{flex:1;padding:0 10px;}
  .choice .pill.on-av{background:var(--sage);border-color:var(--sage-line);color:var(--ink);}
  .choice .pill.on-off{background:var(--ink);border-color:var(--ink);color:var(--cream);}
  .booked-note{background:var(--bk-bg);color:var(--bk-ink);border:1px solid var(--bk-line);padding:16px 18px;}
  .booked-note .eyebrow{color:inherit;margin-bottom:4px;}
  .booked-note .v{font-family:var(--serif);font-size:22px;}

  label.field{display:block;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-2);margin-bottom:4px;font-weight:400;}
  input[type=text],input[type=email],input[type=tel],textarea{width:100%;font-family:var(--sans);font-weight:300;font-size:16px;color:var(--ink);
    background:#F6F4F1;border:1px solid var(--border);border-radius:0;padding:11px 12px;line-height:1.45;}
  textarea{min-height:70px;resize:vertical;}
  input:focus,textarea:focus{outline:none;border-color:var(--tan-dark);background:#fff;}
  ::placeholder{color:#8A847F;}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;}
  .fields .full{grid-column:1/-1;}
  @media(max-width:480px){.fields{grid-template-columns:1fr;} .hero h1{font-size:40px;}}

  .ev{display:grid;grid-template-columns:62px 1fr;gap:16px;}
  .ev-day{font-family:var(--serif);font-size:44px;line-height:0.95;color:var(--burgundy);}
  .ev-mon{font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-2);margin-top:6px;font-weight:400;}
  .ev-name{font-family:var(--serif);font-size:24px;line-height:1.15;margin-bottom:4px;}
  .ev-line{color:var(--text-2);font-size:14px;}
  .ev-line b{font-weight:400;color:var(--ink);}
  .svc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .svc span{font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid var(--border);color:var(--ink);font-weight:400;}

  .pay-total{text-align:center;background:var(--ink);color:var(--cream);padding:28px 18px;margin-bottom:12px;}
  .pay-total .eyebrow{color:var(--tan);margin-bottom:6px;}
  .pay-total .v{font-family:var(--serif);font-size:46px;line-height:1;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .row .sub{font-size:13px;color:var(--text-2);}
  .row .amt{font-family:var(--serif);font-size:20px;white-space:nowrap;}
  .doc-name{font-family:var(--serif);font-size:21px;line-height:1.2;}
  .status-pill{display:inline-block;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;font-weight:400;margin-bottom:6px;}
  .status-pill.ok{background:var(--sage);color:var(--ink);border:1px solid var(--sage-line);}
  .status-pill.need{background:#F0DEDF;color:var(--burgundy);border:1px solid var(--burgundy);}
  .doc-right{display:flex;flex-direction:column;align-items:flex-end;}
  input[type=file]{display:none;}
  .note-line{font-size:13px;color:var(--text-2);margin-top:10px;}

  .status{position:sticky;bottom:0;z-index:40;text-align:center;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-2);
    padding:11px 16px calc(11px + env(safe-area-inset-bottom));background:rgba(232,228,223,0.96);border-top:1px solid var(--border);margin-top:52px;font-weight:400;}
  .status.err{color:var(--burgundy);}
  .status .pill{margin-left:10px;}
  .message{max-width:600px;margin:0 auto;padding:80px 24px;font-family:var(--serif);font-style:italic;font-size:22px;color:var(--text-2);text-align:center;}
  footer{background:var(--ink);color:var(--cream);padding:48px 24px 40px;text-align:center;}
  .footer-brand{font-family:var(--serif);font-size:24px;}
  .footer-tagline{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--tan);margin:2px 0 14px;}
  .footer-name{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(232,228,223,.8);}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important;}}
</style>
</head>
<body>

<div id="root"><div class="message">Loading your page...</div></div>

<footer>
  <div class="footer-brand">MKBeauty Artistry</div>
  <div class="footer-tagline">Your artist page</div>
  <div class="footer-name">Private to you. Please don't share this link.</div>
</footer>

<script>
/* =====================================================================
   CONFIG
   API_URL: the ArtistHub Web App URL. If it says PASTE_..., the page runs
   in preview mode with sample data and nothing is saved.
   THEME: "cream", "burgundy", or "ink".
   ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbxWpmfN1OQy2hr9k31XFQZPLacv0NeL6jUGpTbdcJ-2RkyzSrJ-uiB2g7pIcZWrbzGQKQ/exec";
const STYLE_GUIDE_URL = "https://drive.google.com/file/d/1XXL5DYYefCEpOf1uuApap0TwMCpH32BD/view";
const MONTHS_AHEAD = 12;
const THEME = "cream";

const DEMO = API_URL.indexOf('PASTE_') === 0;
const PARAMS = new URLSearchParams(location.search);
const CODE = PARAMS.get('a') || (DEMO ? 'demo' : '');
document.documentElement.setAttribute('data-theme', (DEMO && PARAMS.get('theme')) || THEME);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

let D = null;
let viewYear, viewMonth, selected = null, payOpen = false;
const today = new Date(); today.setHours(0,0,0,0);
const todayKey = keyOf(today);
const firstMonth = new Date(today.getFullYear(), today.getMonth(), 1);
const lastMonth = new Date(today.getFullYear(), today.getMonth() + MONTHS_AHEAD - 1, 1);

function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromKey(k){ const p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ const v = Number(n)||0; return '$' + v.toLocaleString('en-US', {minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits:2}); }
function niceDate(k){ const d = fromKey(k); return DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate(); }
function shortDate(k){ const d = fromKey(k); return MONTHS[d.getMonth()].slice(0,3) + ' ' + d.getDate(); }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }
async function post(payload){
  if (DEMO) { await new Promise(r => setTimeout(r, 600)); return { success:true, date: todayKey }; }
  const res = await fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({ code: CODE }, payload)) });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

/* ---------- Load ---------- */
async function load(){
  const root = document.getElementById('root');
  if (!CODE) { root.innerHTML = '<div class="message">This link is missing your personal code. Ask Morgan for your page link.</div>'; return; }
  try{
    if (DEMO) D = demoData();
    else {
      const res = await fetch(API_URL + '?a=' + encodeURIComponent(CODE));
      D = await res.json();
      if (D.error) { root.innerHTML = '<div class="message">This link isn\'t working. Ask Morgan for a fresh one.</div>'; return; }
    }
  }catch(e){
    root.innerHTML = '<div class="message">Your page didn\'t load. Check your connection and refresh.</div>'; return;
  }
  D.entries = D.entries || {}; D.booked = D.booked || {}; D.info = D.info || {};
  document.title = D.name + "'s Artist Page | MKBeauty";
  viewYear = firstMonth.getFullYear(); viewMonth = firstMonth.getMonth();
  render();
}

/* ---------- Page ---------- */
function render(){
  const parts = (D.legalName || D.name || '').trim().split(/\s+/);
  const first = D.name || parts[0] || '';
  const last = parts.length > 1 ? parts.slice(1).join(' ') : '';
  const services = String(D.services || D.role || '').split(/[,/]+/).map(s => s.trim()).filter(Boolean);
  const tags = [];
  if (D.tier) tags.push(`<span class="tag tier">${esc(D.tier)}</span>`);
  services.forEach(s => tags.push(`<span class="tag">${esc(s)}</span>`));
  if (D.homeBase) tags.push(`<span class="tag">${esc(D.homeBase)}</span>`);

  document.getElementById('root').innerHTML = `
  <header class="hero"><div class="inner">
    <p class="eyebrow">MKBeauty Artistry Team</p>
    <h1>${esc(first)}${last ? ` <em>${esc(last)}</em>` : ''}</h1>
    <div class="divider"></div>
    ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}
  </div></header>

  <nav class="nav" aria-label="Sections"><div class="nav-inner" id="navInner">
    <a href="#availability">Availability</a><a href="#upcoming">Upcoming</a><a href="#pay">Pay</a>
    <a href="#portfolio">Portfolio</a><a href="#documents">Documents</a><a href="#details">Details</a>
  </div></nav>

  <section class="section" id="availability">
    <p class="eyebrow">Your calendar</p>
    <h2>Mark your <em>availability</em></h2>
    <div class="divider"></div>
    <p class="lede">Tap a date to mark it, and add a note if you need to. Changes save on their own.</p>
    <div class="frame">
      <div class="month-nav">
        <button class="arrow" id="prevBtn" aria-label="Previous month">&#8249;</button>
        <div class="month-title" id="monthTitle"></div>
        <button class="arrow" id="nextBtn" aria-label="Next month">&#8250;</button>
      </div>
      <div class="weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="legend">
      <span><i class="lg-av"></i>Available</span><span><i class="lg-off"></i>Unavailable</span>
      <span><i class="lg-bk"></i>Booked with MKB</span><span><i class="lg-note"></i>Has a note</span>
    </div>
    <div id="panel"></div>
  </section>

  <section class="section" id="upcoming">
    <p class="eyebrow">Next six weeks</p>
    <h2>Upcoming <em>weddings</em></h2>
    <div class="divider"></div>
    <div id="upcomingList"></div>
  </section>

  <section class="section" id="pay">
    <p class="eyebrow">Paid to you</p>
    <h2>Your <em>pay</em></h2>
    <div class="divider"></div>
    <div id="payWrap"></div>
  </section>

  <section class="section" id="portfolio">
    <p class="eyebrow">Your work</p>
    <h2>Your <em>portfolio</em></h2>
    <div class="divider"></div>
    <p class="lede">Add your best recent work. Photos go straight into your MKBeauty portfolio, which we share with brides when they choose their team.</p>
    <div id="portfolioWrap"></div>
  </section>

  <section class="section" id="documents">
    <p class="eyebrow">On file</p>
    <h2>Your <em>documents</em></h2>
    <div class="divider"></div>
    <div class="card" id="docsWrap" style="padding:6px 20px;"></div>
  </section>

  <section class="section" id="details">
    <p class="eyebrow">Keep us in the loop</p>
    <h2>Your <em>details</em></h2>
    <div class="divider"></div>
    <p class="lede">Keep these current so we can always reach you. Changes save as you type.</p>
    <div class="fields" id="infoGrid"></div>
  </section>

  <div class="status" id="status">${DEMO ? 'Preview mode. Nothing is saved.' : 'All changes saved'}</div>`;

  document.getElementById('prevBtn').onclick = ()=> shiftMonth(-1);
  document.getElementById('nextBtn').onclick = ()=> shiftMonth(1);
  renderMonth(); renderUpcoming(); renderPay(); renderPortfolio(); renderDocs(); renderInfo();
  watchNav();
}

// Highlights the menu pill for the section on screen. It only slides the
// menu bar sideways and never scrolls the page, so scrolling down is never pulled back.
function watchNav(){
  const bar = document.getElementById('navInner');
  const links = Array.from(bar.querySelectorAll('a'));
  const map = new Map(links.map(a => [a.getAttribute('href').slice(1), a]));
  const setOn = a => {
    links.forEach(l => l.classList.toggle('on', l === a));
    const left = a.offsetLeft - 24, right = a.offsetLeft + a.offsetWidth - bar.clientWidth + 24;
    if (bar.scrollLeft > left) bar.scrollLeft = left; else if (bar.scrollLeft < right) bar.scrollLeft = right;
  };
  setOn(links[0]);
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { const a = map.get(e.target.id); if (a) setOn(a); } });
  }, { rootMargin:'-40% 0px -55% 0px' });
  document.querySelectorAll('.section').forEach(s => io.observe(s));
}

/* ---------- Availability ---------- */
function shiftMonth(n){
  const d = new Date(viewYear, viewMonth + n, 1);
  if (d < firstMonth || d > lastMonth) return;
  viewYear = d.getFullYear(); viewMonth = d.getMonth(); selected = null;
  renderMonth();
}
function renderMonth(){
  document.getElementById('monthTitle').textContent = MONTHS[viewMonth] + ' ' + viewYear;
  const cur = new Date(viewYear, viewMonth, 1);
  document.getElementById('prevBtn').disabled = cur <= firstMonth;
  document.getElementById('nextBtn').disabled = cur >= lastMonth;
  const days = new Date(viewYear, viewMonth + 1, 0).getDate();
  let html = '';
  for (let i = 0; i < cur.getDay(); i++) html += '<div class="day blank"></div>';
  for (let d = 1; d <= days; d++){
    const date = new Date(viewYear, viewMonth, d), k = keyOf(date);
    const bk = D.booked[k], en = D.entries[k] || {};
    let cls = 'day', label = '';
    if (bk) { cls += ' bk'; label = 'booked'; }
    else if (en.status === 'Available') { cls += ' av'; label = 'available'; }
    else if (en.status === 'Unavailable') { cls += ' off'; label = 'unavailable'; }
    if (date < today) cls += ' past';
    if (k === todayKey) cls += ' today';
    if (k === selected) cls += ' selected';
    const dot = (!bk && en.note) ? '<span class="dot"></span>' : '';
    html += `<div class="${cls}" data-k="${k}" role="button" tabindex="${date < today ? -1 : 0}" aria-label="${esc(MONTHS[viewMonth]+' '+d+(label?', '+label:''))}"><span class="c">${d}</span>${bk ? '<span class="t">Booked</span>' : ''}${dot}</div>`;
  }
  const grid = document.getElementById('grid');
  grid.innerHTML = html;
  grid.querySelectorAll('.day[data-k]').forEach(el => {
    if (el.classList.contains('past')) return;
    const pick = ()=> { const k = el.getAttribute('data-k'); selected = selected === k ? null : k; renderMonth(); };
    el.onclick = pick;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
  });
  renderPanel();
}
function renderPanel(){
  const panel = document.getElementById('panel');
  if (!selected) { panel.innerHTML = ''; return; }
  const bk = D.booked[selected];
  if (bk) {
    panel.innerHTML = `<div class="panel card"><div class="panel-date">${esc(niceDate(selected))}</div>
      <div class="booked-note"><p class="eyebrow">Booked with MKBeauty</p><div class="v">${esc(bk.label || 'Booked')}</div></div>
      <p class="note-line">Morgan manages booked dates. If something looks off, message her.</p></div>`;
    return;
  }
  const en = D.entries[selected] || { status:'', note:'' };
  panel.innerHTML = `<div class="panel card"><div class="panel-date">${esc(niceDate(selected))}</div>
    <div class="choice" role="group" aria-label="Mark this day">
      <button class="pill ${en.status==='Available'?'on-av':''}" id="btnAv" aria-pressed="${en.status==='Available'}">Available</button>
      <button class="pill ${en.status==='Unavailable'?'on-off':''}" id="btnOff" aria-pressed="${en.status==='Unavailable'}">Unavailable</button>
    </div>
    <label class="field" for="noteBox">Note for this day</label>
    <textarea id="noteBox" maxlength="300" placeholder="Free until 2pm, can travel up to 2 hours">${esc(en.note || '')}</textarea>
    ${(en.status || en.note) ? '<div class="pill-row"><button class="pill small" id="clearBtn">Clear this day</button></div>' : ''}</div>`;
  document.getElementById('btnAv').onclick = ()=> setDay({ status: en.status === 'Available' ? '' : 'Available' });
  document.getElementById('btnOff').onclick = ()=> setDay({ status: en.status === 'Unavailable' ? '' : 'Unavailable' });
  const note = document.getElementById('noteBox');
  const saveNote = ()=> { const cur = D.entries[selected] || {}; if ((cur.note||'') !== note.value) setDay({ note: note.value }, true); };
  note.addEventListener('input', debounce(saveNote, 800));
  note.addEventListener('blur', saveNote);
  const clr = document.getElementById('clearBtn');
  if (clr) clr.onclick = ()=> setDay({ status:'', note:'' });
}
function setDay(change, quiet){
  const k = selected;
  const en = Object.assign({ status:'', note:'' }, D.entries[k] || {}, change);
  D.entries[k] = en;
  queue('day:' + k, { action:'artistSave', date:k, status: en.status, note: en.note });
  if (quiet) {
    const cell = document.querySelector('.day[data-k="' + k + '"]');
    if (cell) { const has = cell.querySelector('.dot'); if (en.note && !has) cell.insertAdjacentHTML('beforeend','<span class="dot"></span>'); if (!en.note && has) has.remove(); }
  } else renderMonth();
}

/* ---------- Portfolio ---------- */
function renderPortfolio(){
  document.getElementById('portfolioWrap').innerHTML = `
    <div class="pill-row" style="margin-top:0;">

      ${D.portfolioUrl ? `<a class="pill" href="${esc(D.portfolioUrl)}" target="_blank" rel="noopener">View portfolio</a>` : ''}
    </div>
    <div class="note-line" id="photoStatus" aria-live="polite"></div>
    <input type="file" id="photoInput" accept="image/*" multiple>`;
  const input = document.getElementById('photoInput');
  document.getElementById('addPhotos').onclick = ()=> input.click();
  input.onchange = ()=> uploadPhotos(Array.from(input.files || []), input);
}
async function uploadPhotos(files, input){
  if (!files.length) return;
  const btn = document.getElementById('addPhotos'), st = document.getElementById('photoStatus');
  btn.disabled = true;
  let done = 0, failed = 0;
  for (const f of files){
    st.textContent = `Uploading ${done + failed + 1} of ${files.length}...`;
    try{ const dataUrl = await compress(f, 2400, 0.9); await post({ action:'uploadPortfolio', mimeType:'image/jpeg', data: dataUrl.split(',')[1] }); done++; }
    catch(e){ failed++; }
  }
  st.textContent = failed ? `${done} added. ${failed} didn't upload, so try those again.` : `${done} photo${done === 1 ? '' : 's'} added to your portfolio.`;
  btn.disabled = false; input.value = '';
}
function compress(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const r = new FileReader(); r.onerror = reject;
    r.onload = e => { const img = new Image(); img.onerror = reject;
      img.onload = () => { let w = img.width, h = img.height; const s = Math.min(1, maxDim / Math.max(w, h)); w = Math.round(w*s); h = Math.round(h*s);
        const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); resolve(c.toDataURL('image/jpeg', quality)); };
      img.src = e.target.result; };
    r.readAsDataURL(file);
  });
}

  const input = document.getElementById('w9Input');

async function uploadW9(input){
  const f = input.files && input.files[0];
  if (!f) return;
  const btn = document.getElementById('w9Btn'), sub = document.getElementById('w9Sub');
  if (f.size > 15 * 1024 * 1024) { sub.textContent = 'That file is too large. Try a smaller PDF or photo.'; input.value=''; return; }
  btn.disabled = true; btn.textContent = 'Uploading...';
  try{
    const isImg = /^image\//.test(f.type);
    const dataUrl = isImg ? await compress(f, 2400, 0.92) : await readAsDataUrl(f);
    const res = await post({ action:'uploadW9', mimeType: isImg ? 'image/jpeg' : 'application/pdf', data: dataUrl.split(',')[1] });
    D.w9 = { received:true, date: res.date || todayKey };
    renderDocs();
  }catch(e){ sub.textContent = "That didn't upload. Try again in a moment."; btn.disabled = false; btn.textContent = 'Upload'; }
  input.value = '';
}
function readAsDataUrl(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }

/* ---------- Saving queue (one pending save per item, sent in order) ---------- */
const pending = {};
let sending = false;
function queue(key, payload){ pending[key] = payload; bar('saving'); flush(); }
async function flush(){
  if (sending) return;
  sending = true;
  let failed = false;
  while (Object.keys(pending).length){
    const k = Object.keys(pending)[0], p = pending[k];
    try { await post(p); if (pending[k] === p) delete pending[k]; }
    catch(e){ failed = true; break; }
  }
  sending = false;
  bar(failed ? 'error' : (Object.keys(pending).length ? 'saving' : 'saved'));
}
function bar(mode){
  const el = document.getElementById('status'); if (!el) return;
  el.classList.toggle('err', mode === 'error');
  if (mode === 'saving') el.textContent = 'Saving...';
  else if (mode === 'saved') el.textContent = DEMO ? 'Preview mode. Nothing is saved.' : 'All changes saved';
  else { el.innerHTML = 'Not saved yet<button class="pill small" id="retryBtn">Try again</button>'; document.getElementById('retryBtn').onclick = flush; }
}
window.addEventListener('beforeunload', e => { if (Object.keys(pending).length) { e.preventDefault(); e.returnValue = ''; } });
